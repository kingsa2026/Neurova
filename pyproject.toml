[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120

[tool.pylint.main]
jobs = 0
load-plugins = []

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "W0611",  # unused-import
    "W0612",  # unused-variable
    "W0613",  # unused-argument
    "W0621",  # redefined-outer-name
    "C0301",  # line-too-long (handled by black)
    "C0302",  # too-many-lines
    "C0303",  # trailing-whitespace (handled by black)
    "C0304",  # missing-final-newline (handled by black)
    "C0411",  # wrong-import-order (handled by isort)
    "C0412",  # ungrouped-imports (handled by isort)
    "C0413",  # wrong-import-position (lazy imports pattern)
    "E0401",  # import-error (dependencies may not be installed)
    "E0602",  # undefined-variable (conditional imports)
    "E1101",  # no-member (false positives with dynamic attrs)
    "E1120",  # no-value-for-parameter (false positives)
    "E1121",  # too-many-positional-arguments
    "R0201",  # no-self-use
    "R0401",  # cyclic-import (handled by lazy imports)
    "R0801",  # duplicate-code
    "R0903",  # too-few-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0917",  # too-many-positional-arguments
    "R1701",  # consider-merging-isinstance
    "R1705",  # no-else-return
    "R1710",  # inconsistent-return-statements
    "R1711",  # useless-return
    "R1714",  # consider-using-in
    "R1718",  # consider-using-set-comprehension
    "R1720",  # no-else-raise
    "C0103",  # invalid-name
    "C0209",  # consider-using-f-string
    "E0011",  # unspecified-encoding
    "W0102",  # dangerous-default-value
    "W0107",  # unnecessary-pass
    "W0212",  # protected-access
    "W0602",  # global-variable-not-assigned
    "W0622",  # redefined-builtin
    "W0707",  # raise-missing-from
    "C0209",  # consider-using-f-string
    "R1705",  # no-else-return
    "R0201",  # no-self-use
    "R0903",  # too-few-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "W0622",  # redefined-builtin
    "C0103",  # invalid-name
    "E0011",  # unspecified-encoding
    "W0102",  # dangerous-default-value
    "W0107",  # unnecessary-pass
    "W0212",  # protected-access
    "W0707",  # raise-missing-from
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
good-names = ["i", "j", "k", "e", "f", "x", "y", "_", "db", "id", "ok", "ts", "fp"]

[tool.pylint.design]
max-args = 10
max-locals = 20
max-returns = 8
max-branches = 15
max-statements = 80
max-attributes = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
