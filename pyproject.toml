[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120

[tool.pylint.main]
jobs = 0
load-plugins = []

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "W0611",  # unused-import
    "W0612",  # unused-variable
    "W0613",  # unused-argument
    "W0621",  # redefined-outer-name
    "C0301",  # line-too-long (handled by black)
    "C0302",  # too-many-lines
    "C0303",  # trailing-whitespace (handled by black)
    "C0304",  # missing-final-newline (handled by black)
    "C0411",  # wrong-import-order (handled by isort)
    "C0412",  # ungrouped-imports (handled by isort)
    "C0413",  # wrong-import-position (lazy imports pattern)
    "E0401",  # import-error (dependencies may not be installed)
    "E0602",  # undefined-variable (conditional imports)
    "E1101",  # no-member (false positives with dynamic attrs)
    "E1120",  # no-value-for-parameter (false positives)
    "E1121",  # too-many-positional-arguments
    "R0201",  # no-self-use
    "R0401",  # cyclic-import (handled by lazy imports)
    "R0801",  # duplicate-code
    "R0903",  # too-few-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0917",  # too-many-positional-arguments
    "R1701",  # consider-merging-isinstance
    "R1705",  # no-else-return
    "R1710",  # inconsistent-return-statements
    "R1711",  # useless-return
    "R1714",  # consider-using-in
    "R1718",  # consider-using-set-comprehension
    "R1720",  # no-else-raise
    "C0103",  # invalid-name
    "C0209",  # consider-using-f-string
    "E0011",  # unspecified-encoding
    "W0102",  # dangerous-default-value
    "W0107",  # unnecessary-pass
    "W0212",  # protected-access
    "W0602",  # global-variable-not-assigned
    "W0622",  # redefined-builtin
    "W0707",  # raise-missing-from
    "C0209",  # consider-using-f-string
    "R1705",  # no-else-return
    "R0201",  # no-self-use
    "R0903",  # too-few-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "W0622",  # redefined-builtin
    "C0103",  # invalid-name
    "E0011",  # unspecified-encoding
    "W0102",  # dangerous-default-value
    "W0107",  # unnecessary-pass
    "W0212",  # protected-access
    "W0707",  # raise-missing-from
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
good-names = ["i", "j", "k", "e", "f", "x", "y", "_", "db", "id", "ok", "ts", "fp"]

[tool.pylint.design]
max-args = 10
max-locals = 20
max-returns = 8
max-branches = 15
max-statements = 80
max-attributes = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 使用 importlib import mode 避免重名测试模块冲突
# （tests/ 下有 ad-hoc 文件与 unit/ 下的同名文件，prepend 模式会冲突）
addopts = "-v --tb=short --import-mode=importlib"
# pytest-timeout 全局挂死保护（Windows 自动用 thread 方法，Linux 用 signal）；
# 慢测试用 @pytest.mark.timeout(N) 单独放宽，CLI --timeout 可临时覆盖
timeout = 30

[tool.coverage.run]
# P0-6：CI 覆盖率门禁的度量范围 = 受保护子集实际 exercising 的模块。
# context/ 等待 P1-1 测试落地后加入；预存失败模块不进度量。
# 注意：include 与 source 并用会被忽略（coverage 限制），此处只列 include。
include = [
    "*/tool_layers/mcp_client.py",
    "*/tool_layers/mcp_config.py",
    "*/tool_layers/mcp_bootstrap.py",
    "*/tool_layers/tool_router.py",
    "*/security/url_guard.py",
    "*/security/governance.py",
    "*/api/endpoints/tool_layers.py",
    "*/api/endpoints/shared_config.py",
]

[tool.ruff.lint]
# P0-6 起步规则集：语法错误（E9）+ 未定义名（F821）——对应 static gate 的
# 两类低级高危。F401/F541/F841 等风格项为存量噪音（neurova 200+），待
# 存量清理后再逐类放开。
select = ["E9", "F821"]

[tool.ruff.lint.per-file-ignores]
# F821 存量技术债（建门禁时清点，逐个销账后删除对应行）：
# - neurflow_api.py：用户并行工作中的 _WEBHOOK_RATE_LIMITERS
# - test_memory_stream/test_console_api 等：from x import * 星号导入误报
# - test_minimal_coverage/test_auth_system 等：缺 json/pytest 导入（潜伏）
"neurova/api/endpoints/neurflow_api.py" = ["F821"]
"tests/integration/test_memory_stream.py" = ["F821"]
"tests/test_api/test_console_api.py" = ["F821"]
"tests/unit/agent/test_agent_llm_error_logging.py" = ["F821"]
"tests/unit/channels/test_channel_manager.py" = ["F821"]
"tests/unit/core/test_plugins_modules.py" = ["F821"]
"tests/unit/security/test_auth_system.py" = ["F821"]
"tests/unit/test_minimal_coverage.py" = ["F821"]
