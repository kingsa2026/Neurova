<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

  color: #e0e6f0;
  overflow: hidden;
  height: 100vh;
}
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: linear-gradient(135deg, rgba(15,20,40,0.95), rgba(20,30,60,0.95));

  border-bottom: 1px solid rgba(100,140,255,0.15);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
#header h1 {
  font-size: 20px; font-weight: 600;
  background: linear-gradient(135deg, #6ea8fe, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#header .stats { font-size: 12px; color: #8892a8; display: flex; gap: 16px; }
#header .stats span { display: flex; align-items: center; gap: 4px; }
#header .stats .dot { width: 6px; height: 6px; border-radius: 50%; }

#controls {
  position: fixed; top: 56px; left: 0; right: 0; z-index: 99;
  background: rgba(12,16,30,0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(100,140,255,0.1);
  padding: 8px 24px; display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 4px 12px; border-radius: 16px; border: 1px solid rgba(100,140,255,0.2);
  background: rgba(30,40,70,0.6); color: #8892a8; font-size: 12px;
  cursor: pointer; transition: all 0.2s; user-select: none;
}
.filter-btn:hover { border-color: rgba(100,140,255,0.4); color: #b0b8d0; }
.filter-btn.active { background: rgba(100,140,255,0.2); border-color: rgba(100,140,255,0.5); color: #6ea8fe; }
#search {
  padding: 4px 12px; border-radius: 16px; border: 1px solid rgba(100,140,255,0.2);
  background: rgba(30,40,70,0.6); color: #e0e6f0; font-size: 12px;
  width: 200px; outline: none;
}
#search::placeholder { color: #556; }
#search:focus { border-color: rgba(100,140,255,0.5); }

#graph { width: 100vw; height: 100vh; }

#tooltip {
  position: fixed; pointer-events: none; z-index: 200;
  background: linear-gradient(135deg, rgba(15,20,45,0.97), rgba(25,35,65,0.97));
  backdrop-filter: blur(16px);

#tooltip .tt-desc { font-size: 12px; color: #a0a8c0; line-height: 1.6; }

#detail-panel .dp-list li::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: #6ea8fe; flex-shrink: 0; }
#detail-panel .dp-conn { margin-top: 8px; }
#detail-panel .dp-conn-item {
  font-size: 12px; color: #a0a8c0; padding: 4px 8px; margin: 2px 0;

#detail-panel .dp-conn-item .conn-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  background: rgba(12,16,30,0.8); border: 1px solid rgba(100,140,255,0.1);

  .force('collision', d3.forceCollide().radius(d => d.size + 10))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

// 渐变定义
const defs = svg.append('defs');
Object.entries(categories).forEach(([key, cat]) => {
  const grad = defs.append('radialGradient').attr('id', `grad-${key}`);
  grad.append('stop').attr('offset', '0%').attr('stop-color', cat.color).attr('stop-opacity', 0.9);
  grad.append('stop').attr('offset', '100%').attr('stop-color', cat.color).attr('stop-opacity', 0.4);
});

// 连线
const linkG = g.append('g').attr('class', 'links');
const linkElements = linkG.selectAll('line')
  .data(links).enter().append('line')
  .attr('stroke', d => {
    const sc = categories[nodes.find(n => n.id === (d.source.id || d.source))?.cat]?.color || '#334';
    return sc;
  })
  .attr('stroke-opacity', d => 0.08 + d.strength * 0.06)
  .attr('stroke-width', d => d.strength * 0.8);

// 节点组
const nodeG = g.append('g').attr('class', 'nodes');
const nodeElements = nodeG.selectAll('g')
  .data(nodes).enter().append('g')
  .attr('cursor', 'pointer')
  .call(d3.drag()
    .on('start', dragStart)
    .on('drag', dragged)
    .on('end', dragEnd));

// 光晕
nodeElements.append('circle')
  .attr('r', d => d.size + 6)
  .attr('fill', d => categories[d.cat].color)
  .attr('opacity', 0.08);

// 主圆
nodeElements.append('circle')
  .attr('r', d => d.size)
  .attr('fill', d => `url(#grad-${d.cat})`)
  .attr('stroke', d => categories[d.cat].color)
  .attr('stroke-width', 1.5)
  .attr('stroke-opacity', 0.5);

// 标签
nodeElements.append('text')
  .text(d => d.label)
  .attr('text-anchor', 'middle')
  .attr('dy', d => d.size + 14)
  .attr('fill', d => categories[d.cat].color)
  .attr('font-size', d => Math.max(9, Math.min(12, d.size * 0.5)))
  .attr('font-weight', 500)
  .attr('opacity', 0.85);

// 交互
const tooltip = d3.select('#tooltip');
nodeElements
  .on('mouseover', function(e, d) {
    if (isHighlighting) return;
    d3.select(this).select('circle:nth-child(2)')
      .transition().duration(200)
      .attr('r', d.size + 4)
      .attr('stroke-width', 2.5)
      .attr('stroke-opacity', 0.9);
    highlightConnected(d);
    showTooltip(e, d);
  })
  .on('mousemove', (e) => {
    tooltip.style('left', (e.pageX + 16) + 'px').style('top', (e.pageY - 10) + 'px');
  })
  .on('mouseout', function(e, d) {
    if (isHighlighting) return;
    d3.select(this).select('circle:nth-child(2)')
      .transition().duration(200)
      .attr('r', d.size)
      .attr('stroke-width', 1.5)
      .attr('stroke-opacity', 0.5);
    resetHighlight();
    tooltip.style('display', 'none');
  })
  .on('click', (e, d) => {
    e.stopPropagation();
    showDetail(d);
  });

svg.on('click', () => { closeDetail(); resetHighlight(); });

// 力更新
simulation.on('tick', () => {
  linkElements
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
});

// 拖拽
function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

// 高亮
let isHighlighting = false;
function highlightConnected(d) {
  isHighlighting = true;
  const connected = new Set();
  links.forEach(l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    if (sid === d.id) connected.add(tid);
    if (tid === d.id) connected.add(sid);
  });
  connected.add(d.id);
  nodeElements.transition().duration(200)
    .attr('opacity', n => connected.has(n.id) ? 1 : 0.1);
  linkElements.transition().duration(200)
    .attr('stroke-opacity', l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return (sid === d.id || tid === d.id) ? 0.5 : 0.02;
    })
    .attr('stroke-width', l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return (sid === d.id || tid === d.id) ? l.strength * 1.5 : l.strength * 0.5;
    });
}
function resetHighlight() {
  isHighlighting = false;
  nodeElements.transition().duration(300).attr('opacity', 1);
  linkElements.transition().duration(300)
    .attr('stroke-opacity', d => 0.08 + d.strength * 0.06)
    .attr('stroke-width', d => d.strength * 0.8);
}

// Tooltip
function showTooltip(e, d) {
  const cat = categories[d.cat];
  tooltip.html(`
    <div class="tt-cat" style="color:${cat.color}">${cat.label}</div>
    <div class="tt-title">${d.label}</div>
    <div class="tt-desc">${d.desc}</div>
    <div class="tt-files">${d.files.map(f => `<code>${f}</code>`).join('<br>')}</div>
  `).style('display', 'block')
    .style('left', (e.pageX + 16) + 'px')
    .style('top', (e.pageY - 10) + 'px');
}

// Detail Panel
function showDetail(d) {
  const cat = categories[d.cat];
  const panel = d3.select('#detail-panel');
  panel.select('.dp-title').text(d.label).style('color', cat.color);
  panel.select('.dp-cat').text(cat.label).style('color', cat.color);
  panel.select('.dp-desc').text(d.desc);
  const filesList = panel.select('.dp-files').html('');
  d.files.forEach(f => filesList.append('li').text(f));
  const connDiv = panel.select('.dp-conn').html('');
  links.forEach(l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    if (sid === d.id || tid === d.id) {
      const otherId = sid === d.id ? tid : sid;
      const other = nodes.find(n => n.id === otherId);
      if (!other) return;
      const oc = categories[other.cat];
      const item = connDiv.append('div').attr('class', 'dp-conn-item')
        .on('click', () => {
          const node = nodeElements.filter(n => n.id === otherId);
          const transform = d3.zoomTransform(svg.node());
          svg.transition().duration(500).call(
            zoom.transform,
            d3.zoomIdentity.translate(width/2, height/2).scale(transform.k).translate(-other.x, -other.y)
          );
          showDetail(other);
          highlightConnected(other);
        });
      item.append('span').attr('class', 'conn-dot').style('background', oc.color);
      item.append('span').text(`${other.label} (${l.label})`);
    }
  });
  panel.style('display', 'block');
  isHighlighting = true;
  highlightConnected(d);
}
function closeDetail() {
  d3.select('#detail-panel').style('display', 'none');
  resetHighlight();
}

// 过滤器
let activeFilters = new Set(Object.keys(categories));
const filterDiv = d3.select('#filter-btns');
Object.entries(categories).forEach(([key, cat]) => {
  filterDiv.append('span')
    .attr('class', 'filter-btn active')
    .attr('data-cat', key)
    .style('border-color', cat.color + '40')
    .html(`<span style="color:${cat.color}">●</span> ${cat.label}`)
    .on('click', function() {
      const btn = d3.select(this);
      if (activeFilters.has(key)) {
        activeFilters.delete(key);
        btn.classed('active', false);
      } else {
        activeFilters.add(key);
        btn.classed('active', true);
      }
      applyFilters();
    });
});

function applyFilters() {
  const query = d3.select('#search').property('value').toLowerCase();
  nodeElements.transition().duration(300)
    .attr('opacity', d => {
      if (!activeFilters.has(d.cat)) return 0.05;
      if (query && !d.label.toLowerCase().includes(query) && !d.desc.toLowerCase().includes(query)) return 0.1;
      return 1;
    });
  linkElements.transition().duration(300)
    .attr('stroke-opacity', l => {
      const sn = nodes.find(n => n.id === (l.source.id || l.source));
      const tn = nodes.find(n => n.id === (l.target.id || l.target));
      if (!sn || !tn) return 0.02;
      if (!activeFilters.has(sn.cat) || !activeFilters.has(tn.cat)) return 0.02;
      return 0.08 + l.strength * 0.06;
    });
}

d3.select('#search').on('input', applyFilters);

// 图例
const legendDiv = d3.select('#legend');
legendDiv.append('h3').text('图例');
Object.entries(categories).forEach(([key, cat]) => {
  const count = nodes.filter(n => n.cat === key).length;
  legendDiv.append('div').attr('class', 'legend-item')
    .html(`<span class="legend-dot" style="background:${cat.color}"></span>${cat.label} (${count})`)
    .on('click', () => {
      activeFilters.clear();
      activeFilters.add(key);
      d3.selectAll('.filter-btn').classed('active', false);
      d3.select(`.filter-btn[data-cat="${key}"]`).classed('active', true);
      applyFilters();
    });
});

// Minimap
const minimapSvg = d3.select('#minimap-svg');
const minimapG = minimapSvg.append('g');
function updateMinimap(transform) {
  minimapG.selectAll('*').remove();
  const scale = 0.08;
  nodes.forEach(d => {
    if (!activeFilters.has(d.cat)) return;
    minimapG.append('circle')
      .attr('cx', 90 + (d.x - width/2) * scale)
      .attr('cy', 60 + (d.y - height/2) * scale)
      .attr('r', 2)
      .attr('fill', categories[d.cat].color)
      .attr('opacity', 0.6);
  });
}

// 统计
d3.select('#node-count').text(nodes.length);
d3.select('#link-count').text(links.length);
d3.select('#cat-count').text(Object.keys(categories).length);

// 初始缩放适配
setTimeout(() => {
  svg.transition().duration(800).call(
    zoom.transform,
    d3.zoomIdentity.translate(width * 0.05, height * 0.05).scale(0.9)
  );
}, 500);

// 窗口调整
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('width', w).attr('height', h);
  simulation.force('center', d3.forceCenter(w / 2, h / 2));
  simulation.alpha(0.3).restart();
});
</script>
</body>
</html>
