# Dependabot 依赖更新（Issue #56：此前无 Dependabot / Renovate，依赖更新全靠手工）
#
# 为何按周而非每日：本仓库 CI 六门禁较重（导入巡检 + 覆盖率 + e2e 冒烟 + 前端 1668 用例），
# 每日 PR 会淹没评审队列；周一批次足够覆盖 CVE 响应窗口（配合 CI 里阻塞的 pip-audit /
# npm audit —— 真正紧急的漏洞由审计门禁直接红灯，不必等 Dependabot 提单）。
#
# 分组策略：dev 依赖与 patch/minor 各自成组，减少 PR 数量；major 单独成 PR 便于逐个评估
# （openai 3.x / filelock 4.x / importlib-metadata 9.x 这类 major 会打破 API，
#  不能与 patch 混在一个 PR 里被"顺手合并"）。
version: 2
updates:
  # ── 后端 Python：CI 精简依赖 + 生产全量依赖 ──────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  # ── 前端 npm：NeurUI ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/NeurUI"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # 传递依赖由 package.json overrides 统一收口（undici / brace-expansion），
      # 让 Dependabot 直接改传递依赖版本会与 overrides 打架。
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
  # ── 运行时 npx 包（tools/npx-runtime）──────────────────────────────────
  # 这些包由 `npx -y pkg@ver` 在用户机器上现拉现跑，版本单点登记在
  # neurova/tool_layers/npx_runtime_registry.py。Dependabot 在这里提的 PR
  # 必须同时改登记表与锁文件（守卫 tests/unit/tools/test_npx_runtime_pinning.py
  # 会校验三者一致），故单独成组、不混入主仓 PR。
  - package-ecosystem: npm
    directory: "/tools/npx-runtime"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npx-runtime
    commit-message:
      prefix: "build(deps)"
    groups:
      npx-runtime-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npx-runtime-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # 传递依赖由 package.json overrides 统一收口（同 NeurUI 侧纪律）。
      # swagger-jsdoc 6.3.0 用精确版本 yaml "2.0.0-1" 引入 yaml，Dependabot
      # 直接改这条传递依赖会与 overrides 打架；yaml 的升级路径是
      # 「改 overrides → 重生成锁 → osv 实扫」，见 overridesNote 与
      # docs/05-reports/dependency-cve-ledger.md 的 CVE-2026-33532 一节。
      - dependency-name: "yaml"
  # ── Rust：Tauri 桌面壳（NeurUI/src-tauri/Cargo.lock）────────────────────
  # Issue #56 残留边界：该依赖树此前从不被任何工具看过（pip-audit 与
  # npm audit 都覆盖不到 Rust）。Cargo 更新由 dependabot 每周提单。
  # 注意：glib 已由仓内补丁修复（NeurUI/src-tauri/vendor/glib-0.18.5），
  # unic-* 仍被上游钉死——见 scripts/ci/osv-allowlist.toml。
  # 强行升 glib 到 0.20+ 会与 gtk 的 ^0.18 约束失配（29be2081 曾打断 Windows 打包），
  # glib / gtk / wry / tao 的升级 PR 需逐个人工评估。
  - package-ecosystem: cargo
    directory: "/NeurUI/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
      - tauri
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
  # ── CI 自身（GitHub Actions 版本）────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
