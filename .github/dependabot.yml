# Dependabot 依赖更新（Issue #56：此前无 Dependabot / Renovate，依赖更新全靠手工）
#
# 为何按周而非每日：本仓库 CI 六门禁较重（导入巡检 + 覆盖率 + e2e 冒烟 + 前端 1668 用例），
# 每日 PR 会淹没评审队列；周一批次足够覆盖 CVE 响应窗口（配合 CI 里阻塞的 pip-audit /
# npm audit —— 真正紧急的漏洞由审计门禁直接红灯，不必等 Dependabot 提单）。
#
# 分组策略：dev 依赖与 patch/minor 各自成组，减少 PR 数量；major 单独成 PR 便于逐个评估
# （openai 3.x / filelock 4.x / importlib-metadata 9.x 这类 major 会打破 API，
#  不能与 patch 混在一个 PR 里被"顺手合并"）。
version: 2
updates:
  # ── 后端 Python：CI 精简依赖 + 生产全量依赖 ──────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  # ── 前端 npm：NeurUI ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/NeurUI"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # 传递依赖由 package.json overrides 统一收口（undici / brace-expansion），
      # 让 Dependabot 直接改传递依赖版本会与 overrides 打架。
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
  # ── CI 自身（GitHub Actions 版本）────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
