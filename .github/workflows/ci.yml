name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# P0-6 分层门禁（自内向外加固）：
#   1. static-gate          语法/未定义名/导入巡检（既有，成本极低）
#   2. lint                 ruff E9+F821（规则集与豁免见 pyproject [tool.ruff.lint]）
#   3. import-and-regression 模块导入巡检 + 审计回归（既有）
#   4. unit-tests           受保护测试子集（scripts/ci/protected_tests.txt）
#                           + 覆盖率门禁（pyproject [tool.coverage.run]，fail_under=60）
#                           单腿：跑生产解释器（Issue #301，版本事实源 = Dockerfile
#                           的 FROM；判据见 tests/unit/ci/test_unit_tests_single_leg.py）
#   5. frontend             npm audit --audit-level=high（阻塞）+ vue-tsc + vitest
#   6. dependency-audit     pip-audit 阻塞审计：CI 精简锁 + 生产全量锁（requirements-full.lock）
#                           + OSV 扫非 pip 依赖树（Cargo.lock / npx 运行时包锁）
#   7. perf-gate            import 时长预算 + 关键路径微基准（阻断，
#                           见 scripts/ci/perf_gate.py）
#   8. deploy-config        部署配置一致性（Dockerfile / docker-compose / Helm /
#                           requirements 跨文件不变量，阻断，
#                           见 scripts/ci/deploy_config_consistency_check.py）
#                           注：GitHub 侧无定时触发，同门禁的"时间维度"兜底由
#                           cnb 的周级 crontab 流水线承担（.cnb.yml）。
#   9. experience-quality   经验质量基准（工单 009，阻断）：冻结的真实语料跑
#                           门槛收紧前/后两臂 A/B，读数取 EKB.quality_snapshot()，
#                           每次先自证低质探针会被判红（防门禁空转），
#                           见 scripts/ci/experience_quality_gate.py

# 原则：只进当前确定全绿的测试；预存失败模块修复后逐个搬入 protected_tests.txt。
# 依赖审计为阻塞门禁：扫出漏洞即红灯（allow-list 走 requirements*.lock 版本收敛，
# 不在 CI 里静默放行）。

jobs:
  # 静态门禁与 lint 是同一条流水线：pyflakes 与 ruff 都在读同一片全仓 AST，
  # 拆两个 job 只是多一次容器启动 + 多一遍全仓遍历（Issue #223 第 2 条）。
  # 合并的是「读几遍」，两条命令逐字保留 —— 不放宽任何一项判据。
  static-gate:
    name: Static gate (syntax + pyflakes + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyflakes + ruff
        run: python -m pip install pyflakes ruff

      - name: Run fast static gate (syntax + undefined names)
        run: python scripts/ci_static_gate.py --skip-import

      - name: Ruff (规则集与 per-file 豁免见 pyproject)
        run: python -m ruff check neurova tests --no-cache

  deploy-config:
    name: Deploy config consistency (Dockerfile / compose / Helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: python -m pip install pyyaml

      - name: Deploy config consistency gate
        run: python scripts/ci/deploy_config_consistency_check.py

  import-and-regression:
    name: Import sweep + audit regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      # 装的是锁不是声明：三条 job 装同一份精简依赖，锁过一次就不必各自解析
      # 整棵依赖树（无锁 pip 解析是这三种装法里最慢的一种，Issue #223 第 3 条）。
      - name: Install core dependencies (locked lean set, no torch)
        run: python -m pip install -r requirements-ci.lock

      - name: Run full static gate (incl. module import sweep)
        run: python scripts/ci_static_gate.py

      - name: Run audit regression tests
        run: python -m pytest tests/unit/test_audit_regressions.py -q

  unit-tests:
    name: Unit tests (protected subset + coverage)
    runs-on: ubuntu-latest
    # 本 job 的墙：整段上限。它与下面的单档墙（`--timeout 1500`）必须严格有序，
    # 与 .cnb.yml 那道 stage 的 `timeout: 90m` 同值同源。
    timeout-minutes: 90
    # 分片矩阵：与 cnb 侧同片数（片号的事实源是 `scripts/ci/protected_tests.*.txt` 有几个文件）。
    # 为什么分片：单进程跑整份清单的峰值 RSS 实测 2.74~2.78 GiB 且仍在爬升，
    # 构建 `cnb-v9p-1k5pkvplt` 的 `code 137` 就是跑测进程被整段掐断；
    # 分片后每片各自一个 pytest 进程，判据（覆盖率阈值）不逐片判、见下方 coverage job。
    # 判据见 tests/unit/ci/test_protected_subset_shards.py（两侧片数不一致即红）。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # fetch-depth: 0 是**判据的运行前提**，不是优化项：
      #   受保护子集里的 test_protected_subset_registration_history.py 按清单
      #   历史判「条目曾登记过、是否被静默删掉」，默认的 depth=1 只给到当前一个
      #   提交，它会拿"只有现值"的假历史作答 —— 台账署名被判成"从未登记过"，
      #   失败点名的是一屏无关条目。由 tests/unit/ci/…registration_history.py 反锁。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 单腿即生产解释器（Issue #301）：与 Dockerfile 的 `FROM python:` 同源，
          # 不在此写死第二份版本的事实源。
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv pip install --system -r requirements-ci.lock

      # 单档墙（`--timeout 1500`＝25m）必须严格窄于本 job 的墙（`timeout-minutes: 90`）：
      # 两层同为 30 时，慢格只来得及被记成 `Timeout`，先到点的是整段被掐断——
      # 2026-10-24/25 两次红色都出在这个形状上。分片后这条口径逐片照旧。
      # 覆盖率门禁不在分片里判（实测单片 49%、整份 88%，逐片判会假红）：
      # 各片只攒 `data/coverage/.coverage*`，由下面的 `coverage` job 合并后再判一次。
      - name: Run protected subset shard ${{ matrix.shard }} (collect coverage)
        # 清单逐行读到位置参数上，`$TESTS` 那种"压成一行再交给 shell 切词"的写法
        # 会因清单里的一条空行让后面的条目整片错位（构建 cnb-1f0-1k5uonjt2-003）。
        # 两侧同一口径，判据 tests/unit/ci/test_protected_subset_shards.py 咬两头。
        run: |
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            [ -f "$entry" ] || { echo "❌ 清单点名了不存在的文件：$entry"; exit 1; }
            set -- "$@" "$entry"
          done <<EOF
          $(grep -v '^#' "scripts/ci/protected_tests.${{ matrix.shard }}.txt" | grep -v '^[[:space:]]*$')
          EOF
          # `COVERAGE_FILE` 指进 `data/coverage/`：coverage 的缺省落点是 `./.coverage`，
          # 而合并那一步（`scripts/ci/coverage_report.py --data-dir data/coverage`）只认那个目录。
          # 两处各猜一次路径就是"跑测说全绿、合并说没数据"——本仓实测过一次（cnb 构建
          # `cnb-4gd-1k5us1o1q`：stage 2 全绿，stage 3 报 `没有找到任何覆盖率数据`）。
          # 片号进文件名，免得矩阵里多个 job 抢同一个文件。
          COVERAGE_FILE=data/coverage/.coverage.shard-${{ matrix.shard }} \
            python -m pytest -q --timeout 1500 --cov --cov-report= --cov-fail-under=0 "$@"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: data/coverage/.coverage*
          include-hidden-files: true
          if-no-files-found: error

  # 覆盖率门禁（受保护子集整体口径）：分片各攒数据，这里合并后再判一次。
  # 阈值 60 与 cnb 侧同源（`scripts/ci/coverage_report.py --fail-under 60`），
  # pyproject 不得再写一份 `fail_under`（由 tests/unit/ci/test_context_coverage_scope.py 钉住）。
  coverage:
    name: Coverage gate (protected subset, fail_under=60)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv pip install --system -r requirements-ci.lock

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: data/coverage-raw

      - name: Gather shard coverage data
        run: |
          mkdir -p data/coverage
          find data/coverage-raw -name '.coverage*' -exec cp {} data/coverage/ \;

      - name: Coverage gate (fail_under=60, judged once over the whole subset)
        run: python scripts/ci/coverage_report.py --fail-under 60

  e2e:
    name: E2E backend boot smoke (P1-8)
    runs-on: ubuntu-latest
    needs: static-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal runtime deps
        # e2e 只做 boot 冒烟（health/docs/metrics/鉴权拒绝），不需要全量依赖；
        # fastapi/uvicorn + app 的最小 import 面随 requirements 演进维护
        # --no-deps 不解析依赖树，故 import 面用到的第三方包必须逐个显式点名：
        #   bcrypt / passlib —— neurova.auth.password_hasher 用 bcrypt 原生 API 哈希
        #                       （passlib 仅作声明侧的算法来源），缺席即 conftest 导入崩
        #   python-dotenv / aiosqlite / prometheus_client —— 配置加载 / sqlite 依赖 /
        #                       /metrics 暴露面（历史上曾随 passlib[bcrypt] 等 extras 隐式带入）
        # 以上皆为"裸 import 无降级"，非已知可选依赖，不进 ci_static_gate.KNOWN_OPTIONAL_DEPS
        run: |
          python -m pip install -r requirements.txt --no-deps
          python -m pip install fastapi uvicorn httpx pydantic pydantic-settings pytest \
            pytest-timeout bcrypt passlib python-dotenv aiosqlite prometheus_client

      - name: Boot smoke (spawns real backend, probes health/docs/metrics/auth)
        run: python -m pytest tests/e2e/test_backend_boot.py -q --timeout 240

  frontend:
    name: Frontend (vue-tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NeurUI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: NeurUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm, blocking on high/critical)
        run: npm audit --audit-level=high

      - name: Type check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

  perf-gate:
    name: Performance regression gate (import budget + microbench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install minimal deps (locked)
        run: python -m pip install -r requirements-ci.lock

      - name: Perf regression gate
        run: python scripts/ci/perf_gate.py

  dependency-audit:
    name: Dependency audit (pip-audit, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # OSV 离线漏洞库缓存（`scripts/ci/osv_audit.py` 的 OSV_DB_CACHE 落点）。
      # 不缓存时每一次构建都要重下整份 npm 库（实测 206MB / 47s+），
      # 而它与「某次提交是否引入漏洞」毫无关系——纯网络往返（Issue #223 第 1 条）。
      # 卷/缓存判据由 tests/unit/test_ci_pipeline_speed_guard.py 与脚本的
      # OSV_DB_CACHE 同源校验，不写死第二份口径。
      - name: Cache OSV offline databases
        uses: actions/cache@v6
        with:
          path: ~/.cache/osv-scalibr
          key: osv-scalibr-${{ runner.os }}

      - name: Prefetch OSV offline databases (best effort)
        # 先把漏洞库落到 runner 本地缓存，让下面两条门禁的裁决**都不依赖**
        # api.osv.dev 的实时可达性——2026-09-22 PR #121 三次红全因该域名
        # 在 CI 容器里不可达（扫描器此时退 127 并印一句「0 漏洞」）。
        #
        # **必须排在 pip-audit 两条之前**（Issue #357）：`pip_audit_gate.py`
        # 的离线裁决通路读的就是这一步落下的 `PyPI/all.zip`。此前预取排在后面，
        # 于是 pip-audit 两条永远走直连——构建 `cnb-a99-1k4bpgeim` 的
        # `audit full runtime locked set`（169 包 = 169 次 POST）撞上连接失败，
        # 3 次重试耗尽后退 2，成为与提交内容无关的阻塞红灯。同一构建里 85 包的
        # `requirements-ci.lock` 过了，正说明这不是配置问题而是长链路上的必然抖动。
        # 预取覆盖的生态由 `osv_audit.py` 的 `OFFLINE_DB_SCOPE` 单源给出
        # （crates.io / npm / PyPI），不在本文件里手抄第二份。
        #
        # 预取失败**不判红**：库过期只漏报新公告，库缺失只是让门禁回退直连；
        # 把一条随网络抖动的命令放进阻塞门禁，就是本单在消灭的那个形态。
        # 判据在门禁本体：缓存齐就走离线、不齐则点名并回退（可读、可复算）。
        run: python scripts/ci/osv_audit.py --prefetch-offline-databases || true

      # pip-audit 经 scripts/ci/pip_audit_gate.py 调用（Issue #354）：直调
      # `python -m pip_audit` 时 pypi.org 的一次 15s 读超时就是阻塞红灯，而那次红
      # 与提交内容无关。包装脚本换 `--vulnerability-service osv`、给足单次查询超时、
      # 并只对基础设施错误重试；离线库在场时改走离线口径（OSV-Scanner + 本地
      # `PyPI/all.zip`），裁决不再依赖远端可达性。与 cnb 侧命令逐字一致
      # （test_ci_parity_guard.py 守）。
      - name: Audit CI locked set
        run: python scripts/ci/pip_audit_gate.py -r requirements-ci.lock

      - name: Audit full runtime locked set
        # CI 锁只覆盖精简子集，生产全量依赖（curl_cffi/onnxruntime/transformers/
        # playwright/paramiko/pycryptodome ...）此前完全无人扫——本步补齐该缺口。
        run: python scripts/ci/pip_audit_gate.py -r requirements-full.lock

      - name: Audit non-pip trees (Rust crates + runtime npx packages)
        # pip-audit / npm audit 之外的两片依赖面（Issue #56 残留边界）：
        #   * NeurUI/src-tauri/Cargo.lock —— Tauri 桌面壳 447 个 crate
        #   * tools/npx-runtime/package-lock.json —— 运行时 `npx -y` 现拉的包
        # 两者都在生产执行路径上，此前无锁无审计。统一走 OSV-Scanner，
        # 允许清单（带理由+到期日）见 scripts/ci/osv-allowlist.toml。
        # 不带 `--require-offline`：上面那步预取是 best-effort（`|| true`），
        # 门禁就不能要求「预取必须成功」——否则预取一失败就是红灯，而这与
        # 「真有未允许漏洞」在合并流程里同形，读日志的人仍只能重跑。
        # 缓存不齐时门禁**回退直连并点名缺哪一份**（裁决通路收口在
        # resolveVerdictChannel 一处），红只留给「真有未允许漏洞」。
        run: python scripts/ci/osv_audit.py

  experience-quality:
    name: Experience quality benchmark (real corpus A/B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install minimal deps (locked)
        run: python -m pip install -r requirements-ci.lock

      - name: Experience quality gate
        # 语料是冻结在仓内的真实投影（tests/fixtures/experience_quality_corpus.json，
        # 由 --freeze-corpus 只读抽自生产库），CI 上不碰 data/ 活库；两臂读数取
        # EKB.quality_snapshot()，判据阈值取 008 的 ALERT_THRESHOLDS。
        # 每次运行先自证低质探针会被判红，探针不红即 exit 2（门禁不可信）。
        run: python scripts/ci/experience_quality_gate.py
