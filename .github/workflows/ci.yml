name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# P0-6 分层门禁（自内向外加固）：
#   1. static-gate          语法/未定义名/导入巡检（既有，成本极低）
#   2. lint                 ruff E9+F821（规则集与豁免见 pyproject [tool.ruff.lint]）
#   3. import-and-regression 模块导入巡检 + 审计回归（既有）
#   4. unit-tests           受保护测试子集（scripts/ci/protected_tests.txt）
#                           + 覆盖率门禁（pyproject [tool.coverage.run]，fail_under=60）
#                           py3.11/3.12 matrix
#   5. frontend             npm audit --audit-level=high（阻塞）+ vue-tsc + vitest
#   6. dependency-audit     pip-audit 阻塞审计：CI 精简锁 + 生产全量锁（requirements-full.lock）
#                           + OSV 扫非 pip 依赖树（Cargo.lock / npx 运行时包锁）
#   7. perf-gate            import 时长预算 + 关键路径微基准（阻断，
#                           见 scripts/ci/perf_gate.py）

# 原则：只进当前确定全绿的测试；预存失败模块修复后逐个搬入 protected_tests.txt。
# 依赖审计为阻塞门禁：扫出漏洞即红灯（allow-list 走 requirements*.lock 版本收敛，
# 不在 CI 里静默放行）。

jobs:
  static-gate:
    name: Static gate (syntax + pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyflakes
        run: python -m pip install --upgrade pip pyflakes

      - name: Run fast static gate (syntax + undefined names)
        run: python scripts/ci_static_gate.py --skip-import

  lint:
    name: Lint (ruff E9 + F821)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff (规则集与 per-file 豁免见 pyproject)
        run: python -m ruff check neurova tests --no-cache

  import-and-regression:
    name: Import sweep + audit regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install core dependencies (lean set, no torch)
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Run full static gate (incl. module import sweep)
        run: python scripts/ci_static_gate.py

      - name: Run audit regression tests
        run: python -m pytest tests/unit/test_audit_regressions.py -q

  unit-tests:
    name: Unit tests (protected subset + coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv pip install --system -r requirements-ci.lock

      - name: Run protected subset with coverage gate (fail_under=60)
        run: |
          TESTS=$(grep -v '^#' scripts/ci/protected_tests.txt | tr '\n' ' ')
          python -m pytest -q --cov --cov-report=term --cov-fail-under=60 $TESTS

  e2e:
    name: E2E backend boot smoke (P1-8)
    runs-on: ubuntu-latest
    needs: static-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal runtime deps
        # e2e 只做 boot 冒烟（health/docs/metrics/鉴权拒绝），不需要全量依赖；
        # fastapi/uvicorn + app 的最小 import 面随 requirements 演进维护
        # --no-deps 不解析依赖树，故 import 面用到的第三方包必须逐个显式点名：
        #   bcrypt / passlib —— neurova.auth.password_hasher 用 bcrypt 原生 API 哈希
        #                       （passlib 仅作声明侧的算法来源），缺席即 conftest 导入崩
        #   python-dotenv / aiosqlite / prometheus_client —— 配置加载 / sqlite 依赖 /
        #                       /metrics 暴露面（历史上曾随 passlib[bcrypt] 等 extras 隐式带入）
        # 以上皆为"裸 import 无降级"，非已知可选依赖，不进 ci_static_gate.KNOWN_OPTIONAL_DEPS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --no-deps
          python -m pip install fastapi uvicorn httpx pydantic pydantic-settings pytest \
            pytest-timeout bcrypt passlib python-dotenv aiosqlite prometheus_client

      - name: Boot smoke (spawns real backend, probes health/docs/metrics/auth)
        run: python -m pytest tests/e2e/test_backend_boot.py -q --timeout 240

  frontend:
    name: Frontend (vue-tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NeurUI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: NeurUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm, blocking on high/critical)
        run: npm audit --audit-level=high

      - name: Type check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

  perf-gate:
    name: Performance regression gate (import budget + microbench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install minimal deps
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Perf regression gate
        run: python scripts/ci/perf_gate.py

  dependency-audit:
    name: Dependency audit (pip-audit, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit CI locked set
        run: python -m pip_audit -r requirements-ci.lock --progress-spinner off

      - name: Audit full runtime locked set
        # CI 锁只覆盖精简子集，生产全量依赖（curl_cffi/onnxruntime/transformers/
        # playwright/paramiko/pycryptodome ...）此前完全无人扫——本步补齐该缺口。
        run: python -m pip_audit -r requirements-full.lock --progress-spinner off

      - name: Audit non-pip trees (Rust crates + runtime npx packages)
        # pip-audit / npm audit 之外的两片依赖面（Issue #56 残留边界）：
        #   * NeurUI/src-tauri/Cargo.lock —— Tauri 桌面壳 447 个 crate
        #   * tools/npx-runtime/package-lock.json —— 运行时 `npx -y` 现拉的包
        # 两者都在生产执行路径上，此前无锁无审计。统一走 OSV-Scanner，
        # 允许清单（带理由+到期日）见 scripts/ci/osv-allowlist.toml。
        run: python scripts/ci/osv_audit.py
