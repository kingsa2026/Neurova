# 跨生态依赖安全允许清单（OSV-Scanner 格式）
# ============================================================================
# 由 scripts/ci/osv_audit.py 消费，CI 双侧（.cnb.yml / ci.yml）同为阻塞门禁。
#
# 契约（Issue #56 残留边界收口）：
#   1. 每条必须有 id + reason + ignoreUntil。**不接受无理由静音**。
#   2. ignoreUntil 到期后 osv-scanner 会让该条重新报红 → 门禁自动逼你复核。
#      这是刻意设计：允许清单是"有期限的技术债"，不是永久豁免。
#   3. 能升级修掉的一律升级，不进本清单（例：rustls 0.23.43→0.23.45 已实修）。
#   4. 新增条目前先确认"确无修复版本"或"修复超出本仓可控范围（上游未发版）"，
#      并把该判断的证据写进 reason。
#
# ── 本轮情形态（2026-09-18 新增 Cargo 审计门禁时实跑发现）──────────────────
# 首次扫 NeurUI/src-tauri/Cargo.lock（447 包）命中 8 条。其中 rustls 一条当场
# 升级修掉；其余 7 条全部同源于一个上游事实：
#
#   Tauri 2.x 的 Linux 栈把 gtk 钉在 0.18（wry 0.55–0.57 与 tao 0.35–0.37
#   的 Cargo.toml 均为 `gtk ^0.18`），而 gtk 0.19（对应 glib 0.22）尚无
#   wry/tao 正式版采用——即"上游未发版，本仓无处可升"。
#
#   历史证据：本仓曾试过在 Cargo.toml 里强行声明 glib 0.20（提交 29be2081），
#   结果 Windows 上 glib-sys 需 pkg-config + 系统 GLib 而编译失败，打断打包，
#   已由 e2e62d62 回退并在 Cargo.toml 留下"勿无条件加 glib"的注释。
#   → 结论：这条路已证伪，只能等上游。故改为登记 + 到期复核。
#
#   （另一处 unic-* 由 tauri-utils 的 `urlpattern ^0.3` 引入；tauri-utils
#    全 2.x 线均钉 ^0.3，仅 3.0.0-alpha.0 起改用 ^0.6 → 同属"等上游"。
#    而 proc-macro-error 由 glib-macros / gtk3-macros 带入，随 gtk 0.19 一并消失。）
#
# 复核触发条件（到期时按此判断，勿只看日期）：
#   wry 或 tao 任一正式版把 gtk 依赖抬到 ^0.19 → 立刻升 tauri 栈并删除下方
#   glib / proc-macro-error 两条；tauri-utils 正式版（非 alpha）改用
#   urlpattern ^0.6 → 删除 5 条 unic-*。
# ============================================================================

# ── glib 0.18.5：VariantStrIter 未定义行为（GHSA-wrw7-89jp-8q8g）──────────────
# 性质：unsoundness（内存安全），CVSS 6.9，恶意输入可致 NULL 解引用崩溃。
# 可达性：仅 Linux 桌面壳走 gtk 0.18 栈；Windows 打包/后端服务不涉及。
# 上游修复：glib 0.20.0 起已修（本仓 glib 0.22.9 已发布可用），但拉它的
#           wry/tao 仍钉 gtk ^0.18 → glib 只能停在 0.18.5。
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "上游未发版：wry 0.55-0.57 / tao 0.35-0.37 均钉 gtk ^0.18 → glib 只能 0.18.5；glib 0.20+ 已修但需 gtk 0.19（wry/tao 未采用）。强行声明 glib 0.20 曾在 Windows 打断打包（29be2081 已回退，见 Cargo.toml 注释）。复核：wry/tao 抬 gtk 到 ^0.19 即升栈并删本条。"
ignoreUntil = 2027-03-31

# ── proc-macro-error 1.0.4：unmaintained（RUSTSEC-2024-0370）────────────────
# 性质：无已知 CVE，仅"停止维护"告警；纯编译期 proc-macro，不进运行时产物。
# 引入链：gtk 0.18 → glib-macros 0.18.5 / gtk3-macros 0.18.2。
# 处置：随 gtk 0.19 一并消失（同上，等上游）。
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "unmaintained，无 CVE，编译期 proc-macro 不进运行时；由 glib-macros/gtk3-macros 0.18 带入，随 gtk 0.19 升级一并消失。复核：同上。"
ignoreUntil = 2027-03-31

