# Neurova Helm Chart 默认配置

# 全局配置
global:
  imageRegistry: ""
  imagePullSecrets: []

# ServiceAccount 配置
serviceAccount:
  create: true
  annotations: {}
  name: ""

# 后端配置
backend:
  # 镜像配置
  image:
    repository: neurova/backend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # 副本数
  replicaCount: 1
  
  # 服务配置
  service:
    type: ClusterIP
    port: 9527
    targetPort: 9527
  
  # 资源限制
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  
  # 环境变量
  env:
    - name: NEUROVA_PORT
      value: "9527"
    - name: NEUROVA_HOST
      value: "0.0.0.0"
    - name: NEUROVA_ENV
      value: "production"
    - name: PYTHONUNBUFFERED
      value: "1"
  
  # 配置挂载
  configMountPath: /app/config
  
  # 健康检查
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  # 节点选择
  nodeSelector: {}
  
  # 容忍度
  tolerations: []
  
  # 亲和性
  affinity: {}
  
  # Pod 安全上下文
  podSecurityContext:
    fsGroup: 1000
  
  # 容器安全上下文
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true

# 前端配置（生产模式下由后端服务静态文件）
frontend:
  # 是否部署独立的前端服务（开发模式）
  enabled: false
  
  # 镜像配置
  image:
    repository: neurova/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # 副本数
  replicaCount: 1
  
  # 服务配置
  service:
    type: ClusterIP
    port: 8100
    targetPort: 8100
  
  # 资源限制
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# 数据库配置
database:
  # 使用持久卷存储 SQLite 数据
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /app/data
  
  # 数据库文件路径
  dbPath: /app/data/neurova.db

# LLM 配置
llm:
  # API 密钥（通过 Secret 注入）
  apiKeySecret: neurova-llm-secret
  apiKeyKey: api-key
  
  # 默认模型配置
  defaultModel: "gpt-4"
  defaultProvider: "openai"

# 日志配置
logging:
  level: "INFO"
  format: "json"
  file: "/app/logs/neurova.log"

# 监控配置
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s

# Ingress 配置
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: neurova.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# PodDisruptionBudget
pdb:
  enabled: false
  minAvailable: 1

# HorizontalPodAutoscaler
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80