apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neurova.fullname" . }}-config
  labels:
    {{- include "neurova.labels" . | nindent 4 }}
data:
  # 应用配置
  NEUROVA_PORT: {{ .Values.backend.service.port | quote }}
  NEUROVA_HOST: "0.0.0.0"
  NEUROVA_ENV: "production"
  PYTHONUNBUFFERED: "1"
  
  # 日志配置
  LOG_LEVEL: {{ .Values.logging.level | quote }}
  LOG_FORMAT: {{ .Values.logging.format | quote }}
  LOG_FILE: {{ .Values.logging.file | quote }}
  
  # 数据库配置
  DATABASE_PATH: {{ .Values.database.dbPath | quote }}
  
  # LLM 配置
  DEFAULT_MODEL: {{ .Values.llm.defaultModel | quote }}
  DEFAULT_PROVIDER: {{ .Values.llm.defaultProvider | quote }}
  
  # CORS 配置
  CORS_ORIGINS: '*'
  
  # 应用元数据
  APP_NAME: "Neurova"
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  CHART_NAME: {{ .Chart.Name | quote }}
  CHART_VERSION: {{ .Chart.Version | quote }}