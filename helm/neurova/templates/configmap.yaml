apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neurova.fullname" . }}-config
  labels:
    {{- include "neurova.labels" . | nindent 4 }}
data:
  # 应用配置
  NEUROVA_PORT: {{ .Values.backend.service.port | quote }}
  NEUROVA_HOST: "0.0.0.0"
  NEUROVA_ENV: "production"
  PYTHONUNBUFFERED: "1"

  # 日志配置
  # 键名必须是应用真读的：NEUROVA_LOG_LEVEL（start_server.py 读取）、
  # NEUROVA_LOG_JSON（neurova/core/logger.py 读取）、NEUROVA_LOG_FILE
  # （neurova/api/endpoints/console_system.py 读取）。
  # 此前的 LOG_LEVEL / LOG_FORMAT / LOG_FILE 三个键在应用侧零读取方 = 死配置
  # （值看起来设了、实际日志级别从未被改过）。由
  # scripts/ci/deploy_config_consistency_check.py（R5）常驻把关。
  NEUROVA_LOG_LEVEL: {{ .Values.logging.level | quote }}
  NEUROVA_LOG_JSON: {{ ternary "1" "0" .Values.logging.json | quote }}
  NEUROVA_LOG_FILE: {{ .Values.logging.file | quote }}

  # 会话存档落点（读取键是 NEUROVA_SESSIONS_DIR，见 neurova/session_manager.py）。
  # 应用侧默认落数据根，这里显式指回既有 subPath 挂载，老部署的会话档案不失联。
  NEUROVA_SESSIONS_DIR: "/app/sessions"

  # 数据库配置（读取键是 NEUROVA_DB_PATH，见 neurova/core/db_indexes.py）
  NEUROVA_DB_PATH: {{ .Values.database.dbPath | quote }}

  # CORS 配置（读取键是 NEUROVA_CORS_ORIGINS，见 neurova/api/middleware.py；
  # 留空则回落到应用内 config/cors.json 与内置默认来源）
  NEUROVA_CORS_ORIGINS: {{ join "," .Values.cors.origins | quote }}
