{{- if .Values.llm.apiKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.llm.apiKeySecret }}
  labels:
    {{- include "neurova.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.llm.apiKey }}
  {{ .Values.llm.apiKeyKey }}: {{ .Values.llm.apiKey | b64enc | quote }}
  {{- else }}
  {{ .Values.llm.apiKeyKey }}: "" # 请在部署时提供 API 密钥
  {{- end }}
{{- end }}