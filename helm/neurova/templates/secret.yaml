{{- if .Values.llm.apiKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  # 名称沿用 .Values.llm.apiKeySecret（既有部署的 `kubectl create secret ...
  # --from-literal=api-key=...` 迁移路径见 helm/README.md，改名会静默切断
  # 存量 Secret 的引用）
  name: {{ .Values.llm.apiKeySecret }}
  labels:
    {{- include "neurova.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LLM provider 初始 API Key。注意：应用侧并不直读 LLM_API_KEY 环境变量，
  # provider key 的持久化来源是 ~/.neurova/config/providers.json（配置页写入）——
  # 此键位是给 operator 做统一密钥管理/后续接线预留，留空不影响启动。
  {{ .Values.llm.apiKeyKey | default "api-key" }}: {{ .Values.llm.apiKey | default "" | quote }}
{{- end }}
{{- if .Values.auth.jwtSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  # 独立命名（不与 LLM 密钥同资源）：两者的生命周期与轮换周期不同，
  # 且 JWT 密钥是生产必填项、LLM key 可为空——耦合到同一 Secret 会出现
  # "设了 jwtSecret 但 llm.apiKeySecret 为空 → Secret 不存在 → Pod 起不来"。
  name: {{ include "neurova.fullname" . }}-jwt
  labels:
    {{- include "neurova.labels" . | nindent 4 }}
type: Opaque
stringData:
  # JWT 签名密钥（≥32 字节）。生产必须显式提供，否则每个 Pod 各自随机生成：
  # 多副本间 token 互不认可、重启即全员掉线（neurova/api/auth.py
  # _load_or_create_secret_key：env > .jwt_secret 文件 > 自动生成）。
  jwt-secret: {{ .Values.auth.jwtSecret | quote }}
{{- end }}
