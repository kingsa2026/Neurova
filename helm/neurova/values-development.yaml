# Neurova 开发环境配置

# 后端配置
backend:
  replicaCount: 1
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  
  # 与 values.yaml 同源（30/30/5/3，对齐 Dockerfile HEALTHCHECK）：
  # 探活口径跨环境保持一致，避免"开发能起来、生产探针早于应用就绪"。
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# 前端配置（开发模式）
frontend:
  enabled: true
  replicaCount: 1
  
  service:
    type: NodePort
    port: 8100
    targetPort: 8100
    nodePort: 30810
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# 数据库配置
database:
  persistence:
    enabled: false # 开发环境使用 emptyDir

# Ingress 配置
ingress:
  enabled: false

# 自动扩缩容
hpa:
  enabled: false

# 日志配置（键名对齐 values.yaml：level / json / file）
logging:
  level: "DEBUG"
  json: false
  file: "/app/logs/neurova.log"