# Neurova 生产环境配置

# 鉴权配置（生产 fail-closed：未提供 jwtSecret 时 helm 渲染期直接失败）
auth:
  requireJwtSecret: true

# 后端配置
backend:
  # 注意：当前默认持久化为嵌入式 SQLite + ReadWriteOnce 卷，多副本无法共享
  # （多进程同写会损坏库）。replicaCount>1 时请改用外部数据库，或改走
  # 单副本 + 垂直扩容。2026-11-19 拍板：生产默认收回单副本（对齐嵌入式
  # SQLite 现实形态，R7 警告随之消除）；HPA/多副本需求出现时，先接外部
  # 数据库再把本值调回去。
  replicaCount: 1
  
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# 数据库配置
database:
  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 50Gi
    mountPath: /app/data

# Ingress 配置
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # 移动端长连接：WS 升级（/api/v1/mobile/ws、/api/v1/sync/ws/*）与 SSE（/chat/stream、/notifications/stream）
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: neurova.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: neurova-tls
      hosts:
        - neurova.example.com

# 自动扩缩容
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# PodDisruptionBudget
pdb:
  enabled: true
  minAvailable: 1

# 监控配置
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s

# 日志配置（键名对齐 values.yaml：level / json / file）
logging:
  level: "INFO"
  json: true
  file: "/app/logs/neurova.log"