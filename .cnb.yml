  # ── 接力落点：轮数触顶后「下一轮」的真正入口 ──────────────────────────
  # 三次修，前两次都修错了方向，记在这里免得再犯：
  #   1) 同名评论事件（issue 拉 issue）—— `cnb:apply` 只认固定事件，
  #      `@npc` 不在白名单，且在 `if` 恒假的那些轮里从未被执行到。
  #   2) 换成合法 event 名 `api_trigger_npc_handoff`，仍用 `cnb:apply`——
  #      构建 cnb-i5m-1k355ooo1 实测，收尾 Stage 由 `skipped` 变成 **error**，
  #      平台逐字给出 `cnb:apply can only be used in push/commit.add/branch.create/
  #      pull_request.target/pull_request.mergeable/tag_push/pull_request.merged/
  #      api_trigger/web_trigger/crontab/tag_deploy events`。
  #      于是白名单的判据方向被钉死：校验的是**宿主事件**，不是 `options.event`。
  #      `@npc`（及其宿主 `issue.comment` / `pull_request.comment`）不在列，
  #      改 event 绕不开。
  #   3) 现形态：`cnb:trigger`（适用所有事件，官方 trigger.md）+ 显式
  #      `slug` / `branch` / `env`，指向本文件下方的 `api_trigger_npc_handoff`。
  # 其内用 npc:go 续跑（`npc:go` 适用**所有**事件，见平台的 npc:go 文档）。
  # 上下文不靠"拉同一个评论事件"继承，而靠上一轮经 `env` 显式传递：
  #   对话载体。评论触发时平台注入的 Issue/PR 标识
  #   在 `api_trigger` 流水线里**不会再出现**（平台只注入 API_TRIGGER_* 一族），
  #   不传下去下一轮就无处可读 Issue/PR，接力白跑。
  #
  # 本事件自身也要接力（Issue #158 本轮补）：它此前没有 `endStages`，
  #   于是接力轮一旦再撞顶就断链 —— 实测 17 次接力轮以 error 收场
  #   （cnb-sis-1k3bnmick / cnb-f08-1k3bqnvtf 等），成果随容器一起丢。
  #   判据与上游同源（平台收尾事实变量），对话载体继续经 env 往下传。
  #
  # 对话载体为什么不能在本层声明成「同名变量」（构建 cnb-5bc-1k3e046c7 实测）：
  #   本层此前写的是
  #       env:
  #         handoffIssueIid: $handoffIssueIid
  #         handoffPrIid: $handoffPrIid
  #   而真值只由收尾 `endStages` 的 `cnb:trigger.options.env` 从触发方传下来，
  #   本层 `env` 里那句自引用**永远解析不到值**——平台对无值变量不报错、不告警，
  #   只把配置里的 `$name` 当字面量往下传；下一跳的 carries 再读它、再写一次，
  #   字面量沿链越掺越长（实测 18 → 35 → 84 字符）：
  #       +84 characters ... "...$handoffPrIid-1k3ddqln6$handoffPrIid"
  #   最终 `cnb:trigger` 的目标流水线名被掺坏，报错落在与它无关的地方：
  #       docker: Error response from daemon: Invalid container name (x),
  #       only [a-zA-Z0-9][a-zA-Z0-9_.-] are allowed
  #   （`x` 是镜像自带 entrypoint 给探测容器起的名字，本仓配置里没有这个字符串。）
  #
  #   根因不在报错那一格，而在「声明了 `$同名变量`、却没有任何一跳向它赋值」
  #   这种写法本身（教义第 1 条）。
  #   现形态：本层不再声明 `env`，载体由上一跳经 `cnb:trigger.options.env`
  #   直接注入（平台「环境变量」篇：子流水线的 env 由触发方给出）；
  #   两个键**不成对地缺失**由上游负责——评论侧与载体侧的收尾接力都把
  #   两个键显式供上，不适用的一侧给空串（空串有界，不掺坏流水线名）。
  #   载体层的键集合与每一跳供上的键集合必须一致，由
  #   tests/unit/ci/test_npc_turn_handoff_predicate.py 的
  #   `TestCarrierDeclaresNoSelfReferencingEnv` 常驻钉住。
  #
  # 提示词为何要自带：`role` / `systemPrompt` / `userPrompt` 三个参数
  #   「仅 API 触发时生效」，且 systemPrompt / userPrompt 在 API 触发下**必填**——
  #   评论触发时提示词由角色自带（写在这里也会被忽略），api_trigger 时没有角色上下文。
  #   `role: DSCoder` 让平台按 .cnb/settings.yml 解析人设并拼进 system prompt
  #   （人设仍是配置期唯一必达通道），userPrompt 只补本轮要干的活。
  api_trigger_npc_handoff:
    # 本流水线是**续跑载体**，不是门禁：它跑的是「上一轮用满轮数后继续干」，
    # 配额用满即它的正常结束形态（`npc:go` 会把整条流水线判 error，
    # 而 `endStages` 不改流水线状态 —— 平台「语法手册」）。
    # 不声明 allowFailure 的实测后果（2026-09-25 取证）：
    #   平台把这份 error 当**提交状态检查**上报，与门禁流水线共用同一条通道，
    #   于是合并提交被标红、用户在 PR 上读到的就是「合并失败」。
    #   最近 8 次接力里 5 次如此（41m / 44m / 1h8m / 1h20m / 1h42m 后 error），
    #   每一次的原文都是 `Agent aborted: reached maxTurns limit (200)` ——
    #   本仓自己声明的「配额触发的正常收官」，不是任何门禁的结论。
    #   实例：0cc0719a（#217 的合并提交）的提交状态里挂着
    #   `cnb/api_trigger_npc_handoff/pipeline-1 error [1h 8m]`，而该合并的
    #   门禁流水线当时全绿。
    # 为什么修在**载体**上而不是修判据/放宽门禁（教义第 1／2 条）：
    #   平台已声明用于「失败状态不上报」的唯一手段就是 allowFailure
    #   （平台「语法手册」：为 true 时，流水线的失败状态不会上报到 CNB 上）。
    #   门禁一律保持阻塞——放宽范围由
    #   tests/unit/ci/test_npc_turn_handoff_execution.py 的
    #   `test_gate_pipelines_stay_blocking` 常驻反向钉住。
    - allowFailure: true
      docker:
        image: cnbcool/default-npc:latest
      envScript: *npc-script-interpreter
      stages:
        - name: "npc-go 在册角色接力执行任务（thinkingLevel: max，最高思考档）"
          # 同一个超时事实源（见文件上方的 `&npc-tool-timeout` 锚点）：
          # 接力轮与首轮受同一份预算约束，不另写一个数字。
          <<: *npc-tool-timeout
          type: npc:go
          options:
            # 人设走 .cnb/settings.yml 的角色，唯一必达通道不变。
            # 角色身份随轮传递（PR #276）：硬编码角色名与 .cnb/settings.yml 的
            # npc.roles 是两份口径，角色一改名（DSCoder → DSCoder-Red/Green/Yello/Blue）
            # 就从第二轮起**静默回落平台默认 prompt** —— 平台对不在册的名字不报错、不告警。
            # 现读平台注入的当前角色名（由上一轮收尾经 env 传下来，见 handoffRole）。
            role: $handoffRole
            # API 触发下必填：说明本轮为何被拉起、成果落点在哪。
            systemPrompt: 你是在册的 Neurova 代码搭档。本轮是上一轮撞满轮数配额后的接力轮：上一轮 Agent 被平台中止，成果只留在 Issue/PR 评论里。请先读 Issue/PR 评论区里上一轮的分段落交接（干了什么、下一步是什么、未提交的改动在哪），再从断点继续。
            # 对话载体由上一轮经 env 传下来（api_trigger 流水线里拿不到 CNB_ISSUE_IID）。
            userPrompt: 请先在 Issue/PR 评论区读取上一轮的交接评论，然后继续推进未完成的工作，完成后按惯例提交 PR 并在评论里汇报结论与未闭环项。
            # 接力轮与首轮共用同一份运行参数（同一配额、同一窗口、同一档位、同一图片开关）。
            maxTurns: 2000
            contextWindow: 1m
            maxTokens: 48k
            thinkingLevel: max
            supportImage: true
      # 接力轮撞顶后同样要接力 —— 否则链条到这一轮就断（实测 17 次 error）。
      endStages:
        - name: "轮数触顶接力：接力轮再撞顶时继续接力"
          type: cnb:trigger
          if:
            - '[ "$CNB_PIPELINE_STATUS" = "error" ]'
            # 判据取**失败 stage 名**，不取报错原文：硬中止（stage 被 SIGKILL）时
            # `CNB_BUILD_FAILED_MSG` 只是该 stage 最后一行输出（实测 cnb-m16-1k3f5s0ri：
            # Job 被掐后 `MSG=[start]`），按文案片段匹配等于让「是否接力」取决于
            # 脚本最后打印了什么。stage 名由平台在收尾期注入，与打印内容无关。
            - 'case "$CNB_BUILD_FAILED_STAGE_NAME" in *"npc-go"*) true;; *) false;; esac'
          options:
            slug: $CNB_REPO_SLUG
            event: api_trigger_npc_handoff
            branch: $CNB_BRANCH
            env:
              handoffIssueIid: $handoffIssueIid
              handoffPrIid: $handoffPrIid
              # 角色身份随轮传递：平台把无值变量替换为空串，故根必须来自
              # 平台注入的 $CNB_NPC_NAME（见上游三条事件的收尾接力），
              # 本跳只做「把上一跳传下来的原样继续传」。
              handoffRole: $handoffRole

# 全部在册角色都不挂顶层 key：一律落到 `$` 兜底。
# （不写死角色数量与名单——名单的事实源是 .cnb/settings.yml 的 npc.roles，
#   抄一份进注释就立刻过期，那是「只写不读的第二份定义」。）
#
# 为什么不挂：.cnb.yml 的顶层 key 在平台 Schema 里**只认分支名**——
#   * Schema 层：顶层未知 key 只有 `^\..` 形态（锚点定义）被放行，其余一律要求是分支对象；
#   * 语义层：`issue.*` 是仓库级事件，只能落在 `$` 兜底分支下。
# 本仓库在 `$` 下用 `&npc-dscoder-issue / &npc-dscoder-pr` 定义了 max 档的全部运行参数，
# 且不再写 model、只写 thinkingLevel: max —— 全部在册角色的运行参数因此完全相同，
# 故「同一档位的别名」无需第二份定义：被 @ 时落到哪一份，参数都一样。
#
# 「不带后缀的 DSCoder 会不会静默回落平台默认 prompt」这件事仍要有人守：
#   平台按角色名动态匹配顶层 key，未命中角色名时回落 `$`；而角色人设来自
#   .cnb/settings.yml（评论触发时提示词由角色自带），每个在册角色都能拿到本仓的人设
#   与修复教义。该不变量（每个在册角色都被合法挂载点覆盖、顶层 key 只准 `$` 或
#   `^\.` 锚点形态）由 tests/unit/test_ci_npc_config_guard.py 常驻校验。
# （若将来某两个角色确实需要不同参数，正确的做法是让它们在 settings.yml 侧只保留一个角色名，
#   而不是再造一份顶层 key——顶层 key 一旦不是分支名，就是一份过不了 Schema 的配置。）
