# ============================================================================
# Neurova CI — cnb.cool 云原生构建
# ============================================================================
# 与 .github/workflows/ci.yml 对齐的门禁：同源命令、同等严格度、同等放行标准。
# 对齐关系由 tests/unit/test_ci_parity_guard.py 常驻校验（四组断言：
#   job↔pipeline 映射 / 核心命令逐字一致 / 非阻塞语义对齐 / 防样例空壳再生）。
# 改动任一侧配置必须同步另一侧并更新守卫的 EXPECTED_* 表。
#
# 分层（自内向外加固，与 GitHub 侧一致；全部为阻断门禁，无 continue-on-error）：
#   1. static-gate           语法/未定义名巡检（pyflakes）+ ruff E9+F821
#                            （规则集与豁免见 pyproject）——两条都在读同一片全仓 AST，
#                            故并成一条流水线，不再各扫一遍（Issue #223 第 2 条）
#   2. import-and-regression 模块导入巡检 + 审计回归
#   3. unit-tests            受保护子集（scripts/ci/protected_tests.txt）
#                            + 覆盖率门禁 fail_under=60，py3.11/3.12 双跑
#   4. e2e                   后端启动冒烟（health/docs/metrics/鉴权）
#   5. frontend              npm audit --audit-level=high（阻塞）+ vue-tsc + vitest
#   6. dependency-audit      pip-audit 阻塞审计：CI 精简锁 + 生产全量锁（requirements-full.lock）
#                            + OSV 扫非 pip 依赖树（Cargo.lock / npx 运行时包锁）；
#                            离线漏洞库缓存挂卷跨构建复用（Issue #223 第 1 条）
#   7. perf-gate             import 时长预算 + 关键路径微基准（阻断，
#                            见 scripts/ci/perf_gate.py）
#   8. deploy-config         部署配置一致性（Dockerfile / docker-compose /
#                            Helm / requirements 跨文件不变量，阻断，
#                            见 scripts/ci/deploy_config_consistency_check.py）
#   9. experience-quality    经验质量基准（工单 009，阻断）：冻结真实语料的
#                            门槛收紧前后 A/B 读数 + 低质探针自证，
#                            见 scripts/ci/experience_quality_gate.py
#
# 依赖安装口径（Issue #223 第 3/4 条，四条规则，全仓命中点一次扫清）：
#   - 无锁的 `-r requirements-ci.txt` 一律不再出现在 CI 里：装锁
#     （`requirements-ci.lock`）不必解析依赖树，是无锁解析之外最省的一种装法；
#   - 不自举 pip（`pip install --upgrade pip`）：每次构建一次 PyPI 网络往返，
#     与「这次提交是否合格」无关；确需新版 pip 请钉进依赖清单；
#   - e2e 的 `--no-deps` + 显式点名两段式语义**不动**（薄环境是它的设计目的）；
#   - 装的是同一份锁的三条流水线由 tests/unit/test_ci_pipeline_speed_guard.py
#     逐条钉住，回填无锁安装即红。
#
# 原则：只进当前确定全绿的测试；预存失败模块修复后逐个搬入 protected_tests.txt。
#
# 语法约定（见 https://docs.cnb.cool/zh/build/grammar.html）：
#   - 分支 → 事件(push/pull_request) → 流水线数组；同一事件下的多条流水线并发执行，
#     `main.push` 的每条流水线各自独立上报状态，粒度与 GitHub 的 job 对齐
#     （unit-tests 按 py3.11/py3.12 拆为两条，对应 GitHub 的 matrix 两格；
#     static-gate 与 ruff 并成一条，对应 GitHub 侧同为一条的 static-gate job）。
#     条数不在这里手抄：单一事实源是 `main.push` 数组本身的长度，
#     现读数由 tests/unit/ci/test_cnb_header_pipeline_count.py 常驻比对——
#     头部曾手抄过 10 / 11 两个互相矛盾的口径（工单 009 改成 11、Issue #223 合回 10），
#     手抄的那一份漂移时平台不报任何错，故不再保留第二份。
#   - 事件的覆盖面不限于 push/pull_request，也**不限于门禁**：`main` 下另有
#     `commit.add` 的知识库索引与非门禁的周级巡检。它们**不在** `main.push` 数组里，
#     故既不计入上面那个条数、也不参与 GitHub job 的对齐（对齐的对象只是门禁）。
#   - 定时任务用第 3 类顶层 key：`"crontab: <5 段 POSIX cron>"`（分支下一级），
#     平台最小调度间隔 5 分钟，周级用第 5 段（星期）表达；本文件的周级巡检
#     流水线（deploy-config 的时间维度兜底）同样不计入 `main.push` 的条数。
#   - 单条流水线内的 stages 串行；任一 stage 失败即中止该流水线。
#   - runner.cpus: N 对应内存 N×2GiB（本文件最大 4 → 8GiB）。
#   - docker.volumes 为构建节点级缓存（copy-on-write 默认），跨节点不共享；
#     同一流水线内不得声明存在包含关系的卷路径。
#   - YAML 锚点仅在同文件内可用（跨文件 include 不支持锚点），
#     故用 &pipelines / *pipelines 让 push 与 pull_request 共用同一份定义。
#
# 触发范围与 GitHub 侧一致：push 到 main；PR 目标为 main。
# （GitHub 还监听 master，已核对本仓库远端仅 main 分支，故此处不声明。）
#
# 与 GitHub 侧的刻意差异（逐条记录，改任一条都要同步本段与 PR 描述）：
#   1. GitHub 的 e2e job 带 needs: static-gate（静态门禁过了才启动冒烟）；
#      cnb 同一事件下的流水线相互并发、无跨流水线依赖原语，故 e2e 与 static-gate
#      并行启动。放行标准不变（失败上报、阻塞合并）。
#   2. cnb 侧多一条**非门禁**的 `main.commit.add` 知识库索引流水线（Issue #242）；
#      GitHub 侧没有等价 job —— 它不是放行标准的一部分（不裁决任何合并契约），
#      对齐的对象始终只是门禁，故不需要（也不应该）在 GitHub 上造一条空壳 job。
#      为什么不用 `push` 键：`push: &pipelines` 被 `pull_request: *pipelines`
#      以锚点别名共用同一对象，挂上去等于"每提一次 PR 就重建整个知识库"。
# ============================================================================

main:
  # push 事件：流水线定义一次（锚点 &pipelines）
  push: &pipelines
    # ── 1. 静态门禁：语法 + 未定义名 + lint（全仓 AST，一条读到底）─────────
    # 本流水线曾是两条（static-gate 与 lint）：pyflakes 与 ruff 都在读同一片
    # 全仓 AST，拆两条只是多一次容器启动 + 多一遍全仓遍历（Issue #223 第 2 条）。
    # 两条命令逐字保留 —— 合并的是「读几遍」，不是「放宽哪一项判据」。
    - name: static-gate
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.11
        volumes:
          - /root/.cache/pip
      stages:
        - name: install pyflakes + ruff
          script: python -m pip install pyflakes ruff
        - name: fast static gate (syntax + undefined names)
          script: python scripts/ci_static_gate.py --skip-import
          timeout: 10m
        - name: ruff check
          script: python -m ruff check neurova tests --no-cache
          timeout: 15m

    # ── 3. 导入巡检 + 审计回归 ───────────────────────────────────────────
    - name: import-and-regression
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.11
        volumes:
          - /root/.cache/pip
      stages:
        # 装的是锁不是声明：三条流水线装同一份精简依赖，锁过一次就不必各自
        # 解析整棵依赖树（无锁 pip 解析是这三种装法里最慢的一种，Issue #223 第 3 条）。
        - name: install core dependencies (locked lean set, no torch)
          script: python -m pip install -r requirements-ci.lock
          timeout: 20m
        - name: full static gate (incl. module import sweep)
          script: python scripts/ci_static_gate.py
          timeout: 20m
        - name: audit regression tests
          script: python -m pytest tests/unit/test_audit_regressions.py -q
          timeout: 20m

    # ── 4. 单元测试受保护子集 + 覆盖率门禁（py3.11 / py3.12 双跑）────────
    - name: unit-tests-py311
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: python:3.11
        volumes:
          - /root/.cache/pip
          - /root/.cache/uv
      stages:
        - name: install uv + locked dependencies
          script: |
            python -m pip install uv
            uv pip install --system -r requirements-ci.lock
          timeout: 30m
        - name: protected subset with coverage gate (fail_under=60)
          script: |
            TESTS=$(grep -v '^#' scripts/ci/protected_tests.txt | tr '\n' ' ')
            python -m pytest -q --cov --cov-report=term --cov-fail-under=60 $TESTS
          timeout: 30m

    - name: unit-tests-py312
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: python:3.12
        volumes:
          - /root/.cache/pip
          - /root/.cache/uv
      stages:
        - name: install uv + locked dependencies
          script: |
            python -m pip install uv
            uv pip install --system -r requirements-ci.lock
          timeout: 30m
        - name: protected subset with coverage gate (fail_under=60)
          script: |
            TESTS=$(grep -v '^#' scripts/ci/protected_tests.txt | tr '\n' ' ')
            python -m pytest -q --cov --cov-report=term --cov-fail-under=60 $TESTS
          timeout: 30m

    # ── 5. E2E：后端启动冒烟 ─────────────────────────────────────────────
    - name: e2e-backend-boot
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12
        volumes:
          - /root/.cache/pip
      stages:
        # 冒烟只需最小 import 面（health/docs/metrics/鉴权拒绝），不装全量依赖
        # --no-deps 不解析依赖树，故 import 面用到的第三方包必须逐个显式点名：
        #   bcrypt / passlib —— neurova.auth.password_hasher 用 bcrypt 原生 API 哈希
        #                       （passlib 仅作声明侧的算法来源），缺席即 conftest 导入崩
        #   python-dotenv / aiosqlite / prometheus_client —— 配置加载 / sqlite 依赖 /
        #                       /metrics 暴露面（历史上曾随 passlib[bcrypt] 等 extras 隐式带入）
        # 以上皆为"裸 import 无降级"，非已知可选依赖，不进 ci_static_gate.KNOWN_OPTIONAL_DEPS
        - name: install minimal runtime deps
          script: |
            python -m pip install -r requirements.txt --no-deps
            python -m pip install fastapi uvicorn httpx pydantic pydantic-settings pytest \
              pytest-timeout bcrypt passlib python-dotenv aiosqlite prometheus_client
          timeout: 20m
        - name: boot smoke (spawns real backend)
          script: python -m pytest tests/e2e/test_backend_boot.py -q --timeout 240
          timeout: 30m

    # ── 6. 前端：类型门禁 + 单测 ─────────────────────────────────────────
    - name: frontend
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: node:20
        volumes:
          - /root/.npm
      env:
        CI: "true"
      stages:
        - name: install dependencies
          script: cd NeurUI && npm ci
          timeout: 20m
        - name: dependency audit (npm, blocking on high/critical)
          script: cd NeurUI && npm audit --audit-level=high
          timeout: 15m
        - name: type check (vue-tsc)
          script: cd NeurUI && npx vue-tsc --noEmit
          timeout: 20m
        - name: unit tests (vitest)
          script: cd NeurUI && npx vitest run
          timeout: 30m

    # ── 8. 性能门禁：import 时长 + 关键路径微基准（阻断）────────────────
    # 原状：.cnb.yml 无任何 perf/benchmark 任务，尾延迟回归只能人肉发现。
    # 门禁只抓"数量级退化"（预算带充裕裕量），不做精确 benchmark——
    # 精确 benchmark 在共享 runner 上必然 flaky，最终会被绕过。
    - name: perf-gate
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.11
        volumes:
          - /root/.cache/pip
      stages:
        - name: install minimal deps (locked)
          script: python -m pip install -r requirements-ci.lock
          timeout: 20m
        - name: perf regression gate
          script: python scripts/ci/perf_gate.py
          timeout: 15m

    # ── 9. 部署配置一致性（阻塞）─────────────────────────────────────────
    # 三种交付形态（Dockerfile / docker-compose / Helm）此前各写各的、零自动化
    # 对齐检查：端口、健康检查、资源限制、环境变量名、持久化、硬依赖声明全靠
    # 人肉记忆。本门禁把这些跨文件不变量钉成 R1~R12（详见脚本 docstring），
    # 另由 tests/unit/test_deploy_config_guard.py 锁死门禁自身与周级巡检的接线。
    - name: deploy-config
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12
        volumes:
          - /root/.cache/pip
      stages:
        - name: install pyyaml
          script: python -m pip install pyyaml
          timeout: 10m
        - name: deploy config consistency gate
          script: python scripts/ci/deploy_config_consistency_check.py
          timeout: 10m

    # ── 7. 依赖审计（阻塞，对齐 GitHub 已转阻塞的 dependency-audit）────────
    - name: dependency-audit
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12
        volumes:
          - /root/.cache/pip
          # OSV 离线漏洞库缓存（`scripts/ci/osv_audit.py` 的 OSV_DB_CACHE 落点）。
          # 不挂卷时每一次构建都要重下整份 npm 库（实测 206MB / 47s+），
          # 而它与「某次提交是否引入漏洞」毫无关系——纯网络往返（Issue #223 第 1 条）。
          # 卷判据由 tests/unit/test_ci_pipeline_speed_guard.py 与脚本的
          # OSV_DB_CACHE 同源校验，不写死第二份口径。
          - /root/.cache/osv-scalibr
      stages:
        - name: install pip-audit
          script: python -m pip install pip-audit
          timeout: 15m
        - name: audit CI locked set
          script: python -m pip_audit -r requirements-ci.lock --progress-spinner off
          timeout: 20m
        - name: audit full runtime locked set
          # CI 锁只覆盖精简子集，生产全量依赖（curl_cffi/onnxruntime/transformers/
          # playwright/paramiko/pycryptodome ...）此前完全无人扫——本步补齐该缺口。
          script: python -m pip_audit -r requirements-full.lock --progress-spinner off
          timeout: 20m
        - name: prefetch OSV offline databases (best effort)
          # 先把漏洞库落到 runner 本地缓存，让下面这条门禁的裁决**不依赖**
          # api.osv.dev 的实时可达性——2026-09-22 PR #121 三次红全因该域名
          # 在本容器里不可达（扫描器此时退 127 并印一句「0 漏洞」）。
          # 预取失败**不判红**：库过期只漏报新公告，库缺失只是让门禁回退直连；
          # 把一条随网络抖动的命令放进阻塞门禁，就是本单在消灭的那个形态。
          # 判据在门禁本体：缓存齐就走离线、不齐则点名并回退（可读、可复算）。
          script: python scripts/ci/osv_audit.py --prefetch-offline-databases || true
          timeout: 20m
        - name: audit non-pip trees (Rust crates + runtime npx packages)
          # pip-audit / npm audit 之外的两片依赖面（Issue #56 残留边界）：
          #   * NeurUI/src-tauri/Cargo.lock —— Tauri 桌面壳 crate 树
          #   * tools/npx-runtime/package-lock.json —— 运行时 `npx -y` 现拉的包
          # 统一走 OSV-Scanner；允许清单见 scripts/ci/osv-allowlist.toml。
          # 不带 `--require-offline`：上面那步预取是 best-effort（`|| true`），
          # 门禁就不能要求「预取必须成功」——否则预取一失败就是红灯，而这与
          # 「真有未允许漏洞」在合并流程里同形，读日志的人仍只能重跑。
          # 缓存不齐时门禁**回退直连并点名缺哪一份**（裁决通路收口在
          # resolveVerdictChannel 一处），红只留给「真有未允许漏洞」。
          script: python scripts/ci/osv_audit.py
          timeout: 20m

    # ── 10. 经验质量基准（工单 009，阻塞）──────────────────────────────────
    # 收紧了一整轮经验形成链之后，"变好了"必须有一个可比读数回答：冻结的真实语料
    # 跑门槛收紧前/后两臂 A/B，读数取 EKB.quality_snapshot()（008 的唯一算式），
    # 判据阈值取同一张 ALERT_THRESHOLDS。每次运行先自证低质探针会被判红——
    # 探针不红说明判据坏了，那种"绿"比红危险，按 exit 2 出声。
    # 语料是 --freeze-corpus 从生产库只读投影出来的仓内夹具，CI 上不碰 data/ 活库。
    - name: experience-quality
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.11
        volumes:
          - /root/.cache/pip
      stages:
        - name: install minimal deps (locked)
          script: python -m pip install -r requirements-ci.lock
          timeout: 20m
        - name: experience quality gate
          script: python scripts/ci/experience_quality_gate.py
          timeout: 10m

  # pull_request 事件：复用同一份流水线定义（锚点别名，单一事实来源）
  pull_request: *pipelines

  # ── 非门禁流水线：文档知识库增量索引（Issue #242）────────────────────────
  # 为什么挂在 `commit.add` 而不是塞进 `push`：`push: &pipelines` 被
  # `pull_request: *pipelines` 以锚点别名共用（同一个对象），把建库塞进
  # `main.push` 会让「每提一次 PR 就重建整个知识库」——PR 内容尚未定稿，
  # 且建库不裁决任何合并契约，与门禁同列会把两件事的语义混同。
  # `commit.add` 与 `push` 同为「分支被推送新提交」的入口，却是**独立的事件键**，
  # 故建库只跑在 main 的推送侧，PR 侧一个字都不受影响。
  # 这一处偏离 Issue #242 示例（示例把建库挂在 `main.push`）是刻意的，
  # 偏离点与补偿措施全写在 PR 描述里，并由
  # tests/unit/ci/test_knowledge_base_index_wiring.py 常驻钉住。
  #
  # exclude 只有一条，且它不是装饰：`docs/11-legacy/**` 正文自述
  # 「历史/过时文档……不再维护」，喂给 RAG 会让已被取代的旧方案与现行文档
  # 同权回答用户。
  # 它的命中面由守卫逐条反证 —— **空转的排除项进不了配置**：
  # `docs/.cf_doc.md` / `docs/.roles.md`（第三方产品文档）看着该排，实则
  # `docs/**/*.md` 本就不匹配点文件（实测 glob 551 篇 / 含隐藏 553 篇），
  # 给它们各写一条 exclude 就是只写不读的第二份定义。
  commit.add:
    - name: knowledge-base
      stages:
        - name: 更新知识库（docs 文档 + Issue）
          type: knowledge:update
          options:
            include:
              - "docs/**/*.md"
            exclude:
              - "docs/11-legacy/**"
            chunkSize: 1500
            chunkOverlap: 50
            embeddingModel: hunyuan
            issueSyncEnabled: true
            forceRebuild: false
            ignoreProcessFailures: true

  # ── 周级巡检：部署配置漂移（crontab）─────────────────────────────────────
  # 为什么独立成 crontab 而不只放 push/PR：漂移的主要来源**不在本仓的提交里**——
  # 基础镜像上游发版、Helm/K8s API 演进、依赖上游 CVE，都会让"上次对齐过"的
  # 配置在无人改仓库的情况下失效。周级巡检负责抓这类时间维度漂移。
  #
  # 为什么不用 push 兜底：push 门禁只在有人提交时跑，沉寂期等于没有巡检。
  #
  # 周级为什么能写：平台 crontab 支持标准 5 段 POSIX cron（最小调度间隔 5 分钟），
  # 周级 cadence 用第 5 段（星期）表达即 `30 3 * * 1`（每周一 03:30，Asia/Shanghai）。
  # 注意：不要试图用"间隔 N 天"的语义——平台只认 cron 表达式，没有 interval 单位，
  # 也不存在"任务最长存活 3 天"的限制；配置错误的形态只会在解析期报错。
  "crontab: 30 3 * * 1":
    - name: weekly-deploy-config-audit
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12
        volumes:
          - /root/.cache/pip
      stages:
        - name: install pyyaml
          script: python -m pip install pyyaml
          timeout: 10m
        - name: weekly deploy config consistency audit
          script: python scripts/ci/deploy_config_consistency_check.py
          timeout: 10m

# ============================================================================
# 自定义 NPC —— DSCoder
# ============================================================================
# 角色定义见 .cnb/settings.yml；此处为 NPC 事件流水线，只管运行参数，不管人设。
# 触发：Issue/PR 评论中 @kingsa2026/neurova(DSCoder)
# 合并机制：本段覆盖同名事件，未声明的事件保留系统默认行为（故两个事件都声明）。
#
# 为何不写 model：
#   此前写死 model: deepseek-v4.1-flash-max，该模型 ID 平台并不存在，
#   npc:go 又不校验 model 有效性（配置期不报错、流水线能启动），
#   直到真正发请求才被 LLM 网关以 400 拒绝 —— 表现为「配置都对却秒挂」。
#   故此处不指定 model，走平台默认模型，能力参数随之继承平台默认值。
#   如需绑定特定模型，请填平台真实存在的 model ID（不带思考强度后缀）后再放开注释。
#
# 为何 max 后缀必须去掉：
#   deepseek-v4.1-flash-{low,high,max} 只是「同一底座模型 + 不同思考强度」的
#   三个变体名，合法的底座 model ID 只有 deepseek-v4.1-flash（或走平台默认模型）。
#   直接把带后缀的名字传给 model，就是上一轮 400 的同款死法。
#   故本题的解法是：model 只传底座 ID（或留空走默认），
#   思考强度一律用 thinkingLevel 表达。
#
# 为何不把档位也做成 $变量：
#   npc:go.options 走平台配置阶段的 Schema 校验，而校验发生在变量替换之前 ——
#   thinkingLevel 的取值域是枚举（off/minimal/low/medium/high/xhigh/max），
#   写成 $NPC_THINKING 会以「值不在枚举内」配置期直接红。所以档位必须写字面量。
#
# 装配方式（对齐官方《NPC - 按角色名配置》）：
#   档位角色挂【角色名顶层 key】，同名事件覆盖 $ 下的定义，互不干扰；$ 为兜底。
#
# 档位收敛（2026-09-18 按用户口径）：
#   DSCoder 只保留 max 模式，取消 low / high 两档（顶层 key 与 settings.yml
#   角色定义同步删除，守卫同步收敛）。
#   现在：@kingsa2026/neurova(DSCoder) 即 max 档；@...(DSCoder-max) 等价。
# ============================================================================
# ── max 档（唯一档位）：@kingsa2026/neurova(DSCoder) / (DSCoder-max) ────────
# 运行参数只在 `$` 下写一份（落 thinkingLevel: xhigh），
# 避免「$ 中性档 + 被 @ 时落到平台默认低档」的档位漂移；
# 档位角色名与参数的一致性由 tests/unit/test_ci_npc_config_guard.py 常驻校验。
#
# 本批冲突消解（2026-09-22，PR #136 并入 main）：本 PR 侧曾补 `DSCoder:` 顶层
# 挂载点（理由是「`$` 只是兜底，不替代角色名挂载点，不带后缀的 DSCoder 会静默
# 回落平台默认 prompt」）。并入时 main 已由 PR #134 用平台 Schema 证明：
# `.cnb.yml` 顶层 key **只认分支名**，角色名顶层 key 在推送分支那一刻就非法
# （Schema 只放行 `^\..` 锚点形态，语义规则另把 `issue.*` 钉在 `$` 下）。
# 故结论取 main —— 不补角色名挂载点，别名留在 .cnb/settings.yml 侧；
# 而本 PR 的洞见由 `$` 兜底覆盖**全部**角色来满足（平台按角色名动态匹配顶层 key，
# 未命中角色名时回落 `$`），「每个在册角色都有配置期必达通道」这件事因此仍成立，
# 只是不再靠多加一份顶层 key 实现。这条不变量由
# tests/unit/test_ci_npc_config_guard.py 的挂载点判据常驻校验。
# （此处曾有一份 `.档位映射: &npc-level` 的「角色名 → thinkingLevel」表。
#  它没有任何消费方：平台不读 `^\.` 形态的自定义顶层键，本仓守卫也不读它，
#  档位事实源是 `$` 挂载点的 thinkingLevel 现值加 `.cnb/settings.yml` 的角色定义。
#  只写不读的配置是断点，且它已被改成与收敛口径相反的 `DSCoder: high`——
#  规则与行为不一致时没有任何一处会响亮，故连同锚点一并删净（教义第 6 条）。
#  「锚点定义必须有消费方」由 tests/unit/test_ci_npc_config_guard.py 常驻校验。）

# 时间预算条款**不写在这里**。原因（2026-09-22 实测）：
#   `npc:go.options` 只认平台 Schema 声明的键（role / systemPrompt / userPrompt /
#   model / maxTurns / contextWindow / maxTokens / thinkingLevel / supportImage），
#   且评论触发时提示词一律由角色自带 —— 写在此处的 `prompt:` 既不被识别也不生效，
#   而平台对未知键**不报错、不告警、静默忽略**。
#   故条款落在 `.cnb/settings.yml` 每个档位角色的 prompt 里（唯一必达通道），
#   允许键清单见 `.cnb/npc_schema_keys.txt`，两处漂移由
#   tests/unit/ci/test_npc_pipeline_time_budget.py 常驻拦截。
# ── NPC 流水线脚本的解释器解析 ────────────────────────────────────────────────
# `cnbcool/default-npc:latest`（NPC 流水线唯一镜像）**只有 node，没有 python**。
# 构建 cnb-du8-1k34cfhg1 实测：第 1 步 `python scripts/ci/npc_turn_handoff_gate.py`
# 以 `sh: 1: python: not found`（rc=127）收场，Agent 那一步被 skipper 跳过 ——
# 用户看到的是「流水线构建失败」，实际是脚本拉不起来，与任务内容无关。
# 同一条死链的两处命中点（issue.comment@npc / pull_request.comment@npc）一次扫清。
#
# 该脚本现在只做**开工前自证**（工作区可写 + 解释器可用），不再产出任何接力判据 ——
# 判据已搬到平台在收尾时刻注入的事实变量上（见 `$` 段的根因注释）。
#
# 解释器探测逐级降级，且**不做任何安装**（镜像体积与网络都不由本流水线负责）：
#   python3 → python → node（自证脚本用 node 可跑，见
#   tests/unit/ci/test_npc_script_interpreter_reachability.py）；
#   三级都不可用即以 127 收场 —— 请求解释器失败必须响亮，不得静默跳过（教义第 2 条）。
.解释器探测: &npc-script-interpreter |
  # 探测结果给出「怎么跑门禁脚本」。第三级 node 是**特例**：
  # node 按扩展名解析模块，把 `.py` 交给 node 会在解析前以
  # `ERR_UNKNOWN_FILE_EXTENSION` 退出（rc=1，构建 cnb-9cc-1k34ff3t1 实测），
  # 所以 node 分支不能是 `node <script>.py`，必须经桥脚本
  # scripts/ci/run_gate_under_node.sh 提取脚本自带的 node 实现再执行。
  #
  # 调用形态统一由 $NPX_CALL 表达；脚本路径仍逐字出现在 script 里，
  # 故「本流水线确实执行了这个脚本」不因换解释器而不可读
  # （tests/unit/ci/test_npc_turn_handoff_execution.py 的可见性判据）。
  if command -v python3 >/dev/null 2>&1; then
    NPX=python3
    NPX_CALL="python3"
  elif command -v python >/dev/null 2>&1; then
    NPX=python
    NPX_CALL="python"
  elif command -v node >/dev/null 2>&1; then
    NPX=node
    NPX_CALL="sh scripts/ci/run_gate_under_node.sh"
  else
    echo "无可用脚本解释器（python3 / python / node 均不存在）" >&2
    exit 127
  fi

$:
  # ── 轮数触顶接力（回答 Issue #131；判据三次收口见 Issue #158 / #170 / #189）───
  # 事实（真实构建实测，不是推测）：
  #   cnb-2e8-1k341d9s1：201 轮 / 3191326ms，Stage 报 `Agent aborted: reached
  #                      maxTurns limit (200)`
  #   cnb-2v8-1k34htd2p：200 轮 / 2362852ms，同上
  #   cnb-2q8-1k3buskao：**97 轮**却照样拉起了接力（见下方根因）
  #
  # 三轮修法的历史（每轮都被下一个真实构建推翻，记在这里免得再犯）：
  #   1) 燃料由 Agent 在最后一轮自己写 → 撞 maxTurns 时平台**不执行任何收尾
  #      指令/工具调用**，Agent 没有机会写；`if` 恒假，接力是一条死配置。
  #   2) 燃料改由构建侧在 Agent 开工前**无条件**写出（`CNB` 非空即写，
  #      真实构建里恒真）→ `if` 恒**真**。这不是判据写松了，而是判据的输入端
  #      被自己填成了真值：该变量回答「上一轮是否用满配额」，而得知这件事的
  #      唯一时点是收尾期。后果是空轮防护全失效 —— 任一正常收官也照拉下一轮：
  #        cnb-2q8-1k3buskao  Agent stage success（1774s，未撞顶）→ 拉 cnb-lga-1k3c0itrj
  #        cnb-kdg-1k3bv22ct  Agent stage success（3977s，未撞顶）→ 拉 cnb-fln-1k3c2rjk7
  #      代价可复算：接力落点 `api_trigger_npc_handoff` 共 32 次构建 / 22.2 小时
  #      墙钟，其中 17 次又跑满 200 轮 —— 一次普通提问被放大成自动续跑的链条。
  #      实测四条评论触发的父构建（maxTurns=200），收尾接力一律 success：
  #        cnb-2q8-1k3buskao 97 轮 / cnb-tr2-1k3bm5ssd 135 轮
  #        cnb-cou-1k3bmaal8 164 轮 / cnb-ofm-1k3bq16ij 76 轮
  #   3) 现形态：判据改读**平台在收尾期注入的事实**，不再有任何自造标记。
  #      （通道另修过两次：`cnb:apply` 的宿主事件白名单里没有 `@npc` 一族，
  #        详见下方"通道选型"。）
  #
  # 判据（平台「环境变量」篇，收尾期可读；构建 cnb-s4f-1k3c46us9 / cnb-p2q-1k3c2g7u3
  # 以真 npc:go 撞 maxTurns 实测，探针 cnb-c9g-1k3c3dqg7 / cnb-o8q-1k3c25fpt 复核）：
  #   $CNB_PIPELINE_STATUS   收尾期的流水线状态（`error` 表示 stages 失败）
  #   $CNB_BUILD_FAILED_MSG  失败原文，撞顶时为
  #                          `Agent aborted: reached maxTurns limit (N)`
  #   同一 Job 的 `failStages` 里 `CNB_PIPELINE_STATUS` 为空串 —— 故判据只能落在
  #   `endStages` 的 `if` 上（`.cnb.yml` 的 `stages` 块不得出现这两个变量）。
  #   ⇒ 两者同时成立才接力。用户只说一句「你好」的正常收官是 `success`，
  #     第一条即为假，不接力（空轮不烧配额）。
  #   为什么按原文片段判而不是只看 status：`stages` 失败的原因有很多种
  #   （门禁红、依赖装不上、脚本报错），只有"用满轮数"才该续跑；
  #   把任何失败都接成新一轮，等于把真故障转写成烧配额。
  #   判据仍是**一处**：收尾 `if`。既没有第二份状态文件，也没有计数器/预写变量。
  #
  # 接力落点自身也要接力：`api_trigger_npc_handoff` 原先没有
  #   `endStages`，接力轮一旦再撞顶就断链 —— 实测 17 次接力轮以 error 收场
  #   （cnb-sis-1k3bnmick / cnb-f08-1k3bqnvtf 等），成果随容器一起丢。
  #   现补同一份收尾接力，判据同源，对话载体继续经 env 传下去。
  #
  # 通道选型（Issue #170，构建 cnb-i5m-1k355ooo1 实测）：
  #   收尾接力**不能**用 `cnb:apply` —— 它的适用事件白名单
  #   （push/commit.add/branch.create/pull_request.target/pull_request.mergeable/
  #   tag_push/pull_request.merged/api_trigger/web_trigger/crontab/tag_deploy）
  #   里没有 `@npc` 一族，也没有其宿主 `issue.comment` / `pull_request.comment`。
  #   平台校验的是**宿主事件**，不是 `options.event` 的取值 ——
  #   改 event 绕不开，那笔接力在写下那一刻就注定执行不了。
  #   故改用 `cnb:trigger`（适用**所有事件**，官方 trigger.md）：
  #   slug 必填（不默认当前仓库）、branch 显式点名（它默认主分支，
  #   而 PR 评论事件跑在 PR 目标分支，不传会接力到主分支上落空）。
  #
  # 轮次上界（平台依据：docs.cnb.cool 的「超时」与「npc:go」两篇）：
  #   `maxTurns` 是**轮数配额**（一次会话跑 500 轮），不是 2h 墙钟的反推值。
  #   平台墙钟约束的是**整轮会话**，不是"配额不能超过 2h ÷ 单轮耗时"：
  #   真撞顶探针 cnb-8dk-1k3c7a0e0 的读数是 1 轮 / 2428ms，会话只受
  #   `npc:go.timeout`（每次工具执行 20m）与流水线 20h 上限约束。
  #   配额要留得下"跑满 → 收尾接力 → 下一轮再跑满"的余量，而不是贴着
  #   一次会话能容纳的轮数写：实测 2h / 35.3s ≈ 203 轮，而
  #   cnb-f1c-1k31garu5 是 251 轮、cnb-m48-1k33grbms 是 207 轮 ——
  #   两次都是**被平台外部掐断**（无告警、无收尾，worktree 里已改未提交的
  #   成果随容器一起丢），配额并未触达。配额落在掐断轮数之下，
  #   撞顶就永远是"被外部掐断"而不是"配额触发的正常收官"。
  #   （本仓曾用 `2h ÷ 单轮均摊耗时` 给配额做上钳，于是把 500 钳回 200 ——
  #    两件事同源但不同源：平台墙钟 vs 仓库自己可优化的单轮耗时。
  #    详见 tests/unit/test_ci_npc_config_guard.py 的
  #    `TestTurnBudgetMultiplierIsNotAReachableSpinCeiling`，Issue #236。）
  #   总轮数没有硬上界：每一轮都重新判定"我是否真用满了配额"。
  #
  # 事故依据（2026-09-22，构建 cnb-1q8-1k33cb2v9）：上一轮曾把时间禁令写在
  #   .cnb.yml 的注释里，而注释不进 Agent 的上下文，Agent 照样 sleep 轮询容器内
  #   根本不存在的前后端进程，并在收尾用 `pkill -f start_server.py` 把自己所在的
  #   构建容器一并打掉（7261220ms 全部耗在一次零产出的等待上）。
  #   禁令的唯一必达通道是 .cnb/settings.yml 的角色 prompt。
  #
  # 脚本解释器：本 Job 各 stage 由探测结果 $NPX 给出（见 .解释器探测）。
  #   NPC 镜像只有 node；`.py` 交 node 会以 ERR_UNKNOWN_FILE_EXTENSION 退出，
  #   故 node 分支必须经桥脚本 scripts/ci/run_gate_under_node.sh（见其头注释）。
  # 装配方式：三条事件定义共用**同一份 Job 体**（锚点 .npc-dscoder-job），
  #   只在最外层的 `endStages.options.env` 上各自补自己那侧的对话载体
  #   （issue 拉 issue、PR 拉 PR，接力轮继续往下传）—— 逐字重复三份 Job 体会漂移，
  #   故"共用 Job 体 + 只差对话载体"是唯一收敛形态。
  .npc-dscoder-job: &npc-dscoder-job
    - docker:
        image: cnbcool/default-npc:latest
      envScript: *npc-script-interpreter
      stages:
        - name: "构建环境自证：工作区落点可达且与 $PWD 同址"
          # 为何必须由真实构建自证（Issue #151，构建 cnb-du8-1k34cfhg1）：
          #   镜像里没有 python 时，前置步骤会以 `sh: 1: python: not found`
          #   （rc=127）收场，Agent 那一步被 skipper 跳过 —— 用户看到「构建失败」，
          #   而真实死因与任务内容无关。故解释器先探后用，且本步在 Agent 开工前跑。
          # 本步是**环境前提自证**，不是接力的燃料来源：
          #   接力判据自 Issue #189 起直接读平台在收尾期注入的
          #   $CNB_PIPELINE_STATUS / $CNB_BUILD_FAILED_MSG（见上方注释块"判据"），
          #   构建侧不再产出任何被 `if` 消费的真值 —— 那正是上一轮恒真的根因。
          # 保留本步的理由：它回答"接力发生在哪个工作区、$PWD 是不是同一处"，
          #   并把读数（`probe_check` / `working_directory_check`）留在日志里；
          #   且它跑在 Agent 开工**之前**：环境前提有问题要在烧掉整轮预算前响亮。
          script: "$NPX_CALL scripts/ci/npc_turn_handoff_gate.py"
          timeout: 2m
        - name: "DSCoder 执行任务（thinkingLevel: xhigh，max 档）"
          # npc:go 的 `timeout` 作用于 Agent 的**每一次工具执行**（bash 命令），
          # 不是整个 Agent 会话；会话整体只受流水线 20h 上限约束。
          # 它挡不住「300s+420s+480s 串起来的 sleep 轮询」——那只能靠 prompt 禁令兜住。
          timeout: 20m
          type: npc:go
          options:
            # `npc:go.options` **没有 prompt 键**：平台 Schema 只认
            # role / systemPrompt / userPrompt / model / maxTurns / contextWindow /
            # maxTokens / thinkingLevel / supportImage，写别的键被静默忽略。
            # 行为约束一律写在 .cnb/settings.yml 的角色 prompt 里（唯一必达通道）。
            # 不写 model = 走平台默认模型（规避 400）；要锁定底座模型就填真实 ID。
            maxTurns: 500
            contextWindow: 1m
            maxTokens: 48k
            # 平台档位枚举为 off/minimal/low/medium/high/xhigh/max（官方 npc:go 文档），
            # 现行值取 xhigh —— 这是本仓**主动选定**的档位，不是"平台没有 max"。
            # （此前注释写成"平台最高档是 xhigh、没有 max"，是对文档的误读：
            #  枚举里确有 max。要不要提到 max 是耗时/质量权衡，属功能决策，
            #  故只纠正说法、不动取值。）
            thinkingLevel: xhigh
      # 轮数触顶后自动开启下一轮。判据取自**平台在收尾时刻注入的事实变量**
      # （`CNB_PIPELINE_STATUS` / `CNB_BUILD_FAILED_MSG`，实测读数见 `$` 段注释），
      # 不再读任何预写标记或自造状态文件 —— 预写值与"本轮是否撞顶"无关
      # （Issue #158 的根因）。全仓只有这一处判据。
      # `env` 里的对话载体由外层三条事件各自补（见下方 `<<:` 覆写）——
      # 评论触发时平台注入的 `CNB_ISSUE_IID` / `CNB_PULL_REQUEST_IID`
      # 在 `api_trigger` 流水线里不会再出现，不传下去下一轮读不到 Issue/PR。
      endStages:
        - name: "轮数触顶接力：自动开启下一轮（判据取平台收尾事实）"
          type: cnb:trigger
          if:
            - '[ "$CNB_PIPELINE_STATUS" = "error" ]'
            - 'case "$CNB_BUILD_FAILED_MSG" in *"reached maxTurns limit"*) true;; *) false;; esac'
          options:
            slug: $CNB_REPO_SLUG
            event: api_trigger_npc_handoff
            # 分支必须显式点名：`cnb:trigger` 的 branch 默认为**主分支**，
            # 而 `issue.comment@npc` 跑在默认分支、`pull_request.comment@npc`
            # 跑在 PR 目标分支 —— 不传 branch，接力会跑到主分支上，
            # api_trigger_npc_handoff 在那边可能根本不存在（接力静默落空）。
            branch: $CNB_BRANCH
            env:
              handoffIssueIid: $CNB_ISSUE_IID

  issue.comment@npc:
    - <<: *npc-dscoder-job
      endStages:
        - name: "轮数触顶接力：自动开启下一轮（判据取平台收尾事实）"
          type: cnb:trigger
          if:
            - '[ "$CNB_PIPELINE_STATUS" = "error" ]'
            - 'case "$CNB_BUILD_FAILED_MSG" in *"reached maxTurns limit"*) true;; *) false;; esac'
          options:
            slug: $CNB_REPO_SLUG
            event: api_trigger_npc_handoff
            branch: $CNB_BRANCH
            env:
              handoffIssueIid: $CNB_ISSUE_IID
  pull_request.comment@npc:
    - <<: *npc-dscoder-job
      endStages:
        - name: "轮数触顶接力：自动开启下一轮（判据取平台收尾事实）"
          type: cnb:trigger
          if:
            - '[ "$CNB_PIPELINE_STATUS" = "error" ]'
            - 'case "$CNB_BUILD_FAILED_MSG" in *"reached maxTurns limit"*) true;; *) false;; esac'
          options:
            slug: $CNB_REPO_SLUG
            event: api_trigger_npc_handoff
            branch: $CNB_BRANCH
            env:
              handoffPrIid: $CNB_PULL_REQUEST_IID

  # ── 接力落点：轮数触顶后「下一轮」的真正入口 ──────────────────────────
  # 三次修，前两次都修错了方向，记在这里免得再犯：
  #   1) 同名评论事件（issue 拉 issue）—— `cnb:apply` 只认固定事件，
  #      `@npc` 不在白名单，且在 `if` 恒假的那些轮里从未被执行到。
  #   2) 换成合法 event 名 `api_trigger_npc_handoff`，仍用 `cnb:apply`——
  #      构建 cnb-i5m-1k355ooo1 实测，收尾 Stage 由 `skipped` 变成 **error**，
  #      平台逐字给出 `cnb:apply can only be used in push/commit.add/branch.create/
  #      pull_request.target/pull_request.mergeable/tag_push/pull_request.merged/
  #      api_trigger/web_trigger/crontab/tag_deploy events`。
  #      于是白名单的判据方向被钉死：校验的是**宿主事件**，不是 `options.event`。
  #      `@npc`（及其宿主 `issue.comment` / `pull_request.comment`）不在列，
  #      改 event 绕不开。
  #   3) 现形态：`cnb:trigger`（适用所有事件，官方 trigger.md）+ 显式
  #      `slug` / `branch` / `env`，指向本文件下方的 `api_trigger_npc_handoff`。
  # 其内用 npc:go 续跑（`npc:go` 适用**所有**事件，见平台的 npc:go 文档）。
  # 上下文不靠"拉同一个评论事件"继承，而靠上一轮经 `env` 显式传递：
  #   对话载体。评论触发时平台注入的 Issue/PR 标识
  #   在 `api_trigger` 流水线里**不会再出现**（平台只注入 API_TRIGGER_* 一族），
  #   不传下去下一轮就无处可读 Issue/PR，接力白跑。
  #
  # 本事件自身也要接力（Issue #158 本轮补）：它此前没有 `endStages`，
  #   于是接力轮一旦再撞顶就断链 —— 实测 17 次接力轮以 error 收场
  #   （cnb-sis-1k3bnmick / cnb-f08-1k3bqnvtf 等），成果随容器一起丢。
  #   判据与上游同源（平台收尾事实变量），对话载体继续经 env 往下传。
  #
  # 提示词为何要自带：`role` / `systemPrompt` / `userPrompt` 三个参数
  #   「仅 API 触发时生效」，且 systemPrompt / userPrompt 在 API 触发下**必填**——
  #   评论触发时提示词由角色自带（写在这里也会被忽略），api_trigger 时没有角色上下文。
  #   `role: DSCoder` 让平台按 .cnb/settings.yml 解析人设并拼进 system prompt
  #   （人设仍是配置期唯一必达通道），userPrompt 只补本轮要干的活。
  api_trigger_npc_handoff:
    # 本流水线是**续跑载体**，不是门禁：它跑的是「上一轮用满轮数后继续干」，
    # 配额用满即它的正常结束形态（`npc:go` 会把整条流水线判 error，
    # 而 `endStages` 不改流水线状态 —— 平台「语法手册」）。
    # 不声明 allowFailure 的实测后果（2026-09-25 取证）：
    #   平台把这份 error 当**提交状态检查**上报，与门禁流水线共用同一条通道，
    #   于是合并提交被标红、用户在 PR 上读到的就是「合并失败」。
    #   最近 8 次接力里 5 次如此（41m / 44m / 1h8m / 1h20m / 1h42m 后 error），
    #   每一次的原文都是 `Agent aborted: reached maxTurns limit (200)` ——
    #   本仓自己声明的「配额触发的正常收官」，不是任何门禁的结论。
    #   实例：0cc0719a（#217 的合并提交）的提交状态里挂着
    #   `cnb/api_trigger_npc_handoff/pipeline-1 error [1h 8m]`，而该合并的
    #   门禁流水线当时全绿。
    # 为什么修在**载体**上而不是修判据/放宽门禁（教义第 1／2 条）：
    #   平台已声明用于「失败状态不上报」的唯一手段就是 allowFailure
    #   （平台「语法手册」：为 true 时，流水线的失败状态不会上报到 CNB 上）。
    #   门禁一律保持阻塞——放宽范围由
    #   tests/unit/ci/test_npc_turn_handoff_execution.py 的
    #   `test_gate_pipelines_stay_blocking` 常驻反向钉住。
    - allowFailure: true
      docker:
        image: cnbcool/default-npc:latest
      envScript: *npc-script-interpreter
      env:
        handoffIssueIid: $handoffIssueIid
        handoffPrIid: $handoffPrIid
      stages:
        - name: "DSCoder 接力执行任务（thinkingLevel: xhigh，max 档）"
          timeout: 20m
          type: npc:go
          options:
            # 人设走 .cnb/settings.yml 的角色，唯一必达通道不变。
            role: DSCoder
            # API 触发下必填：说明本轮为何被拉起、成果落点在哪。
            systemPrompt: 你是 DSCoder-max —— Neurova 仓库的专属代码搭档。本轮是上一轮撞满轮数配额后的接力轮：上一轮 Agent 被平台中止，成果只留在 Issue/PR 评论里。请先读 Issue/PR 评论区里上一轮的分段落交接（干了什么、下一步是什么、未提交的改动在哪），再从断点继续。
            # 对话载体由上一轮经 env 传下来（api_trigger 流水线里拿不到 CNB_ISSUE_IID）。
            userPrompt: 请先在 Issue/PR 评论区读取上一轮的交接评论，然后继续推进未完成的工作，完成后按惯例提交 PR 并在评论里汇报结论与未闭环项。
            maxTurns: 500
            contextWindow: 1m
            maxTokens: 48k
            thinkingLevel: xhigh
      # 接力轮撞顶后同样要接力 —— 否则链条到这一轮就断（实测 17 次 error）。
      endStages:
        - name: "轮数触顶接力：接力轮再撞顶时继续接力"
          type: cnb:trigger
          if:
            - '[ "$CNB_PIPELINE_STATUS" = "error" ]'
            - 'case "$CNB_BUILD_FAILED_MSG" in *"reached maxTurns limit"*) true;; *) false;; esac'
          options:
            slug: $CNB_REPO_SLUG
            event: api_trigger_npc_handoff
            branch: $CNB_BRANCH
            env:
              handoffIssueIid: $handoffIssueIid
              handoffPrIid: $handoffPrIid

# 全部在册角色都不挂顶层 key：一律落到 `$` 兜底。
# （不写死角色数量与名单——名单的事实源是 .cnb/settings.yml 的 npc.roles，
#   抄一份进注释就立刻过期，那是「只写不读的第二份定义」。）
#
# 为什么不挂：.cnb.yml 的顶层 key 在平台 Schema 里**只认分支名**——
#   * Schema 层：顶层未知 key 只有 `^\..` 形态（锚点定义）被放行，其余一律要求是分支对象；
#   * 语义层：`issue.*` 是仓库级事件，只能落在 `$` 兜底分支下。
# 本仓库在 `$` 下用 `&npc-dscoder-issue / &npc-dscoder-pr` 定义了 max 档的全部运行参数，
# 且不再写 model、只写 thinkingLevel: xhigh —— 这两点正是 DSCoder 与 DSCoder-max 的**全部差异**，
# 故别名无需第二份定义：被 @ 时落到哪一份，运行参数都相同。
#
# 「不带后缀的 DSCoder 会不会静默回落平台默认 prompt」这件事仍要有人守：
#   平台按角色名动态匹配顶层 key，未命中角色名时回落 `$`；而角色人设来自
#   .cnb/settings.yml（评论触发时提示词由角色自带），每个在册角色都能拿到本仓的人设
#   与修复教义。该不变量（每个在册角色都被合法挂载点覆盖、顶层 key 只准 `$` 或
#   `^\.` 锚点形态）由 tests/unit/test_ci_npc_config_guard.py 常驻校验。
# （若将来某两个角色确实需要不同参数，正确的做法是让它们在 settings.yml 侧只保留一个角色名，
#   而不是再造一份顶层 key——顶层 key 一旦不是分支名，就是一份过不了 Schema 的配置。）
