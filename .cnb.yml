    - <<: *npc-dscoder-job
      endStages:
        - name: "轮数触顶接力：自动开启下一轮（判据取平台收尾事实）"
          type: cnb:trigger
          if:
            - '[ "$CNB_PIPELINE_STATUS" = "error" ]'
            # 判据取**失败 stage 名**，不取报错原文：硬中止（stage 被 SIGKILL）时
            # `CNB_BUILD_FAILED_MSG` 只是该 stage 最后一行输出（实测 cnb-m16-1k3f5s0ri：
            # Job 被掐后 `MSG=[start]`），按文案片段匹配等于让「是否接力」取决于
            # 脚本最后打印了什么。stage 名由平台在收尾期注入，与打印内容无关。
            - 'case "$CNB_BUILD_FAILED_STAGE_NAME" in *"npc-go"*) true;; *) false;; esac'
