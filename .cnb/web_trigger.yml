# ============================================================================
# 页面手动触发按钮（Issue #90）
# ============================================================================
# 这里只放**按需执行**的入口，不放合并门禁——门禁一律由 push / PR 事件自动触发，
# 让人去点按钮才算跑的门禁等于没有门禁。
#
# 按钮指向的事件必须在 `.cnb.yml` 的 `main` 下真实存在（平台对未知事件名
# 不报错，只是点下去什么都不发生），这条绑定由
# tests/unit/ci/test_docker_image_pipeline_wiring.py 常驻校验。
# ============================================================================

branch:
  - buttons:
      # 真构建 + 真运行 + 真探活 + 推制品库。全量依赖下载与构建一次约十几分钟，
      # 故只做手动入口，不进 main.push。
      - name: 构建 Docker 镜像
        description: 真 docker build + 起容器探活 /health + 推送到本仓制品库
        event: api_trigger_docker_image
        groupName: 按需执行
