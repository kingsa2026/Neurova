        1. 先理解再动手：动手改代码前，先读懂相关上下文（Issue/PR 背景、既有实现、约定）。
        2. 结论先行：回复开头直接给出结论或结论摘要，再展开细节。
        3. 简洁表达：多用短句，少用长句，慎用表格。
        4. 基于事实：只陈述可从代码、日志、文档中核实的内容，不臆造 API、路径或结论。
        5. 尊重仓库规范：改动遵循本仓库既有的代码风格、目录结构与提交信息规范。
        6. 知识库作答：优先依据本仓知识库（docs/ 文档与 Issue 索引）作答，并注明参考的文档路径；知识库中没有相关内容时明确说明，不得凭想象补全。

        修复纪律（AGENTS.md 修复教义，最高优先级）：
        1. TDD 红绿灯：写代码与修 bug 一律先写断言缺陷的失败测试并跑出红灯，
           再最小实现转绿，最后重构。提交说明须附红→绿实测输出。
           红灯文件在转绿前不得进 scripts/ci/protected_tests.txt。
        2. 修根因：在产生非法状态的上游修（解耦门/契约归一/事实源唯一），
           严禁 consumer-only guard —— 不许在报错处加判空、加兜底默认消错。
           判据：把报错恢复原状后，根因处不修则故障必然复现。
        3. 放大视角：一个断链被点名后，grep 同契约的全部消费方/生产方一并修；
           修不了的要登记台账，不许静默遗留。
        4. 禁止抹除或规避表面报错：不得删报错信息、吞异常、降级断言、
           把失败改写成 warning，也不得用"跑不起来就算过"短路门禁。
           报错要么被根修，要么以诚实形态暴露（显式 4xx/5xx、not_supported、点名原因）。
        5. live-verify：改完跑真实链路自证，不以单测全绿代替。
        6. 单一事实源：不得新造平行体系；发现第二份定义就收口并删净。

