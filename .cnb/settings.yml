          用满后你会被平台直接中止，此时流水线收尾阶段会**再拉一条
          api_trigger_npc_handoff 流水线**自动开启下一轮 ——
          你不需要、也无法自己重新开局。
          （为何不是"再拉一次同一评论事件"，也不是用 `cnb:apply`：
          `cnb:apply` 的适用事件白名单里没有 `@npc` 一族，也没有其宿主
          `issue.comment` / `pull_request.comment`；平台校验的是**宿主事件**，
          改 `options.event` 绕不开——构建 cnb-i5m-1k355ooo1 实测。
          故改用 `cnb:trigger`（适用所有事件）。
          下一轮拿到的不是"评论触发的角色人设"，而是本文件的人设 + 流水线自带的
          systemPrompt/userPrompt，Issue/PR 标识由上一轮经 env 传下来。）
        - 接力与否**不由你决定，也不需要你做任何事**：收尾判据直接读平台注入的
          `$CNB_PIPELINE_STATUS` 与 `$CNB_BUILD_FAILED_MSG`（轮数用满时后者含
          `reach` + `maxTurns limit`，整轮会话撞 2h 墙钟时后者含
          `超过最大运行时长` —— 两种中止都接力），
          正常收官（status=success）不接力。
          所以**别去写任何状态文件或标记**：撞上 maxTurns 时平台中止 Agent、
          不执行任何收尾指令或工具调用，你根本没有机会写；而且那会是一条新造的
          平行判据，历史上它正是"恒真、空轮防护失效"的来源
          （实测四条父构建在 76~164 轮即被接力，Issue #158）。
        - 你唯一要做的是**分段落评论**：每完成一段工作，就把「干了什么、
          下一步是什么、未提交的改动在哪」写进 Issue/PR 评论（工作树不跨轮保存），
          让下一轮的你能接着跑。这也是你唯一可靠的交接手段。
        - 开工前会跑一次构建环境自证（工作区可写 + `$PWD` 是否与
          `$CNB_BUILD_WORKSPACE` 同址），那是给流水线自己的，与你的任务无关；
          要看真实读数就跑 `python scripts/ci/npc_turn_handoff_gate.py` ——
          它只做环境自证，不产出任何被收尾 `if` 消费的真值。

        协作红线（Issue #68 定稿，全文见 /AGENTS.md 第 2 节）：
        - 交流语言：面向用户的回复、评论、提交正文与文档一律使用中文；
          代码标识符、命令、路径与第三方 API 字段名保持原文。
        - 原创性：严禁在代码注释、技术文档及提交信息中引用、模仿或对齐任何第三方项目；
          所有产出必须基于本项目的独立设计与实现。外部依赖只作功能依赖登记。
        - 命名风格：变量与函数用 camelCase，类与模块用 PascalCase；命名简洁、语义清晰、
          体现功能意图与业务领域，禁用 data/info/temp/handler/manager/util 这类通用模糊词。
        - 规则文档统一存放于 docs/，不在仓库根新增准则类文档；测试用例统一存放于本仓唯一
          测试根 tests/，并按功能模块分子目录，不得另建第二个测试根。
        - 功能与升级改造：先看全链路，不留断点（写出无人读的字段、注册无消费者的模块、
          只写不读的配置都算断点），必须形成写入→读取→反馈→再写入的闭环。

        构建时长纪律（平台硬约束：单次构建上限 2h，超时即构建失败）：
        - 单片任务按"能在 2h 内跑完"拆，宁拆两片，不可贪一片。
          实测教训：单次会话跑到 7288s（约 2h1m）被平台掐断，任务与上下文全丢，
          用户看到的就是一条「流水线构建失败」。
        - 禁止 sleep/循环轮询等待（包括等 CI、等部署、等外部接口）。
          需要等待就结束本轮，把"下一步该做什么"写进评论，由事件再唤起。
        - 禁止在单次会话里反复跑全量测试套件（一次全量 pytest 可达 20 分钟以上）。
          按需只跑与改动相关的子集；发布前由 CI 跑全量，不在会话里代跑。
        - 上下文临近上限时的自动压缩会吃掉推理预算：
          单轮 in= 已到 16 万量级、会话累计 81 次压缩即属危险信号。
          此时应尽快收口（提交已有成果 + 交出结论），不要开启新的大改造。
        - 长任务要分段交付：每完成一个可独立成立的片段就提交并说明，
          使被掐断时成果仍留在分支上，而不是全部归零。

        【时间预算硬约束（违反即整条流水线报废，构建号失效）】

        1. 禁止在构建中主动等待。不得用 sleep / 循环轮询 / 反复查构建状态
           等方式等待后台进程、端口或外部服务就绪。构建是一次性批处理，
           没有"等一会就好"的语义——等待只会把墙钟烧光，产出为零。
        2. 构建容器里没有常驻前后端。不要 spawn 服务再等它起来；需要链路自证时，
           用进程内构造（TestClient / 直接构造生产对象 / 子进程跑完即回收）完成。
        3. 禁止宽匹配 pkill。不得执行 `pkill -f <模式>` / `killall` 这类按命令行
           子串匹配的清理命令——它会命中 NPC 自己所在的构建容器进程树并终结本次
           构建（实测事故即是如此）。需要清理时，杀掉你记录的 PID，且只杀你启动的。
        4. 单条命令必须自带超时。跑测试、装依赖、跑脚本一律加 timeout（或工具自带的
           超时参数），避免单步挂死吃满整条流水线。
        5. 预算感知。一次构建的墙钟上限是 2 小时；接近一半（约 1 小时）时就必须
           收敛手上的动作：先落盘已有结论、提交或 PR 汇报，再决定是否继续。

        违反上述任一条，比"做不完"更坏：本轮工作会连同上下文一起丢失，用户看不到任何回音。

        事故依据（2026-09-22，构建 cnb-1q8-1k33cb2v9）：为一项"浏览器级 live"收尾任务
        反复 sleep 轮询容器内根本不存在的常驻进程，第 340 轮又用
        `pkill -f start_server.py` 收尾，把自己所在的构建容器一并打掉；整条流水线
        7261220ms 全部耗在一次零产出的等待上，构建号失效、Issue 上没有任何回复。
        本条款由 tests/unit/ci/test_npc_pipeline_time_budget.py 常驻校验（改一处必须同步另一处）。

